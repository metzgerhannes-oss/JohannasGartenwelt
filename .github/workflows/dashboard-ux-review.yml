name: Dashboard UX redesign and review

"on":
  push:
    paths:
      - '.github/workflows/dashboard-ux-review.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dashboard UX redesign
        run: python tools/dashboard_ux_review.py
      - name: Static UX and syntax audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'JGW DASHBOARD UX REVIEW',
            'id="ecoDashboardCompact"',
            'id="ecoCompactDetailsBtn"',
            'id="addPlantToday"',
            'id="addHabitatToday"',
            'id="addAnimalToday"',
            'function renderCompactEcoDashboard',
            '<h2>Naturgarten</h2>',
            '<h2>Pflanzen</h2>'
          ]
          for x in required: assert x in s, x
          assert s.count('id="ecoDashboard"') == 1
          assert s.count('id="ecoDashboardCompact"') == 1
          today=s.index('id="view-today"')
          tasks=s.index('id="tasks"',today)
          compact=s.index('id="ecoDashboardCompact"',today)
          mapv=s.index('id="view-map"',today)
          assert today < tasks < compact < mapv
          plants=s.index('id="view-plants"')
          detailed=s.index('id="ecoDashboard"',plants)
          pane=s.index('id="naturePlantsPane"',plants)
          assert plants < detailed < pane
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('static audit OK')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Mobile usability smoke test
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options();opt.add_argument('--headless=new');opt.add_argument('--no-sandbox');opt.add_argument('--disable-dev-shm-usage');opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt);d.set_window_size(390,844);wait=WebDriverWait(d,15)
          try:
              d.get('http://127.0.0.1:8000/index.html')
              wait.until(lambda x:x.find_element(By.ID,'todayDate').text.strip()!='')
              assert d.find_element(By.ID,'view-today').get_attribute('class').find('active')>=0
              y_tasks=d.find_element(By.ID,'tasks').rect['y']; y_eco=d.find_element(By.ID,'ecoDashboardCompact').rect['y']
              assert y_tasks < y_eco, (y_tasks,y_eco)
              for bid in ['addPlantToday','addHabitatToday','addAnimalToday']:
                  assert d.find_element(By.ID,bid).rect['height'] >= 44, (bid,d.find_element(By.ID,bid).rect['height'])
              fs=d.execute_script("var e=document.createElement('span');e.className='collection-chip';e.textContent='Test';document.body.appendChild(e);var v=parseFloat(getComputedStyle(e).fontSize);e.remove();return v")
              assert fs >= 11, fs
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')

              d.execute_script("document.getElementById('addHabitatToday').click()")
              wait.until(EC.visibility_of_element_located((By.ID,'habitatEditor')))
              assert 'active' in d.find_element(By.CSS_SELECTOR,'.nature-tab[data-nature="habitats"]').get_attribute('class')
              d.execute_script("document.getElementById('habitatEditor').classList.add('hidden');switchView('today')")
              wait.until(EC.visibility_of_element_located((By.ID,'ecoDashboardCompact')))
              d.execute_script("document.getElementById('addAnimalToday').click()")
              wait.until(EC.visibility_of_element_located((By.ID,'animalEditor')))
              assert 'active' in d.find_element(By.CSS_SELECTOR,'.nature-tab[data-nature="animals"]').get_attribute('class')
              d.execute_script("document.getElementById('animalEditor').classList.add('hidden');switchView('today')")
              wait.until(EC.visibility_of_element_located((By.ID,'ecoDashboardCompact')))
              d.execute_script("document.getElementById('addPlantToday').click()")
              wait.until(EC.visibility_of_element_located((By.ID,'plantEditor')))
              assert 'active' in d.find_element(By.CSS_SELECTOR,'.nature-tab[data-nature="plants"]').get_attribute('class')
              assert d.execute_script("return document.getElementById('ecoDashboard').closest('#view-plants')!==null")
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              print('mobile UX smoke test OK')
          finally:
              d.quit();server.terminate();server.wait(timeout=5)
          PY
      - name: Commit redesigned app and clean temporary files
        shell: bash
        run: |
          rm -f tools/dashboard_ux_review.py .github/workflows/dashboard-ux-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine dashboard hierarchy and mobile usability"
          git push origin main
