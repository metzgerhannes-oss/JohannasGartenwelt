name: Finalize eco collection

"on":
  push:
    paths:
      - '.github/workflows/finalize-eco-collection.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix detail favorite binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=';bindPlantCollectionEvents();document.querySelectorAll(".detailCare").forEach(function(b){'
          new=';var detailFav=el("plantDetailContent").querySelector(".favorite-plant");if(detailFav)detailFav.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();toggleFavorite(detailFav.dataset.id)});document.querySelectorAll(".detailCare").forEach(function(b){'
          assert old in s, 'detail favorite marker missing'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          assert 'var detailFav=el("plantDetailContent").querySelector(".favorite-plant")' in s
          assert ';bindPlantCollectionEvents();document.querySelectorAll(".detailCare")' not in s
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Test favorite toggles exactly once
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt); d.set_window_size(390,844)
          demo={'plz':'','loc':None,'gardenCenter':None,'plants':[{'id':'p1','name':'Wilder Dost','scientific':'Origanum vulgare','family':'Lamiaceae','area':'Wildbeet','type':'bed','water':'low','size':'medium','favorite':False,'photo':'','bloomMonths':[],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-09-01'}],'zones':[],'ecology':{'habitat':{}},'settings':{'plantnetKey':'','seasonMode':'auto','animations':False,'mapView':None,'onboardingDismissed':True,'plantView':'collection','plantSort':'name'},'days':30}
          try:
              d.get('http://127.0.0.1:8000/index.html')
              d.execute_script("localStorage.setItem('giess_check_garten_v3', arguments[0])",json.dumps(demo)); d.refresh(); time.sleep(.5)
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click(); document.querySelector('#plantList .plantOpen').click()")
              WebDriverWait(d,3).until(EC.visibility_of_element_located((By.ID,'plantDetailOverlay')))
              def favorite_value():
                  raw=d.execute_script("return localStorage.getItem('giess_check_garten_v3')")
                  return json.loads(raw)['plants'][0].get('favorite',False)
              assert favorite_value() is False
              d.execute_script("document.querySelector('#plantDetailContent .favorite-plant').click()")
              time.sleep(.2)
              assert favorite_value() is True, 'favorite toggled more than once or not at all'
              d.execute_script("document.querySelector('#plantDetailContent .favorite-plant').click()")
              time.sleep(.2)
              assert favorite_value() is False, 'second favorite click did not toggle once'
              print('detail favorite binding OK')
          finally:
              d.quit(); server.terminate(); server.wait(timeout=5)
          PY
      - name: Remove temporary upgrade machinery and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/eco-collection-upgrade.yml tools/eco_collection_upgrade.py .github/workflows/finalize-eco-collection.yml
          git add index.html
          git commit -m "Finalize plant collection and ecology features"
          git push origin main
