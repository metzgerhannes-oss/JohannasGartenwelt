name: Fix index gallery weather
on:
  push:
    paths:
      - '.github/workflows/fix-index-gallery-weather.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="state-label">Ohne wirksamen Regen</div><div class="state-value" id="gardenDryDays">–</div>'
          new='<div class="state-label">Trockenphase</div><div class="state-value" id="gardenDryDays">–</div>'
          if old not in s:
              raise SystemExit('weather label not found')
          s=s.replace(old,new,1)
          s,n=re.subn(r'/\* JGW PLANT CARD FULL NAME FOOTER \*/.*?/\* /JGW PLANT CARD FULL NAME FOOTER \*/\s*','',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('old plant footer CSS not found')
          s,n=re.subn(r'jgw-library-nav\.js\?v=[^"\']+','jgw-library-nav.js?v=20260914-17',s,count=1)
          if n!=1:
              raise SystemExit('loader reference not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Trockenphase' in s
          assert 'JGW PLANT CARD FULL NAME FOOTER' not in s
          assert 'jgw-library-nav.js?v=20260914-17' in s
          print('index patch OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wetterkachel und Galerie-Basis korrigieren'
          git push
