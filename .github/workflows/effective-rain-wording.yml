name: Effective rain wording
on:
  push:
    paths:
      - '.github/workflows/effective-rain-wording.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch effective rain wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div class="state-item"><div class="state-label">Trockentage</div><div class="state-value" id="gardenDryDays">–</div></div>'
          new='<div class="state-item"><div class="state-label">Ohne wirksamen Regen</div><div class="state-value" id="gardenDryDays">–</div></div>'
          if old not in s: raise SystemExit('dry-days label marker not found')
          s=s.replace(old,new,1)

          old2='source=manual?"manuell korrigiert":((state.weather&&state.weather.jgwHistorySource)||"Open-Meteo"),html=\'<div><b style="color:var(--forest-dark)">💧 Regen gestern: \'+row.rain.toFixed(1).replace(".",",")+\' mm</b><div class="muted" style="margin-top:2px">Wetterdaten v2 · \'+esc(source)+\'</div></div><button class="btn ghost small jgw-rain-correct-btn" type="button">\'+(manual?"Korrektur ändern":"Regen korrigieren")+\'</button>\''
          new2='source=manual?"manuell korrigiert":((state.weather&&state.weather.jgwHistorySource)||"Open-Meteo"),effectNote=row.rain>=2?"Wirksamer Regen · Trockenserie beendet":(row.rain>0?"Zu wenig, um die Trockenphase zu beenden":"Kein wirksamer Regen"),html=\'<div><b style="color:var(--forest-dark)">💧 Regen gestern: \'+row.rain.toFixed(1).replace(".",",")+\' mm</b><div class="muted" style="margin-top:2px">\'+esc(effectNote)+\'</div><div class="muted" style="margin-top:2px;font-size:11px">Wetterdaten v2 · \'+esc(source)+\'</div></div><button class="btn ghost small jgw-rain-correct-btn" type="button">\'+(manual?"Korrektur ändern":"Regen korrigieren")+\'</button>\''
          if old2 not in s: raise SystemExit('yesterday rain marker not found')
          s=s.replace(old2,new2,1)

          old3='gd.textContent=summary.dryDays===0?"Heute Regen":summary.dryDays+" "+(summary.dryDays===1?"Tag":"Tage");'
          new3='gd.textContent=summary.dryDays===0?"0 Tage":summary.dryDays+" "+(summary.dryDays===1?"Tag":"Tage");'
          if old3 not in s: raise SystemExit('dry-days value marker not found')
          s=s.replace(old3,new3,1)

          # bump stable loader query only, no loader code changes
          s=s.replace('./jgw-library-nav.js?v=20260914-11','./jgw-library-nav.js?v=20260914-12',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Ohne wirksamen Regen' in s
          assert 'Zu wenig, um die Trockenphase zu beenden' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(x for x in blocks if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wetteranzeige wirksamen Regen klarstellen'
          git push
