name: Harden photo storage UI

on:
  push:
    paths:
      - '.github/workflows/harden-photo-storage-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct photo storage fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="actions" style="margin-top:10px"><button class="btn secondary small" id="optimizePhotoStorageBtn" type="button">Speicher optimieren</button></div>\n        <div class="muted" id="photoStorageStatus" style="margin-top:7px">Fotospeicher wird geprüft …</div>'
          new='<div class="actions" style="margin-top:10px"><button class="btn secondary small" id="optimizePhotoStorageBtn" type="button" onclick="if(window.JGWPhotoStorageDirect){window.JGWPhotoStorageDirect.optimize()}else{document.getElementById(\'photoStorageStatus\').textContent=\'Fotospeicher-Modul nicht geladen – App bitte einmal vollständig schließen und neu öffnen.\'}">Speicher optimieren</button></div>\n        <div class="muted" id="photoStorageStatus" style="margin-top:7px">Fotospeicher bereit · Status wird geladen …</div>'
          if old not in s:
              raise SystemExit('Photo storage settings markup not found')
          s=s.replace(old,new,1)
          helper=base64.b64decode('').decode('utf-8')
          if 'id="jgw-photo-storage-direct"' not in s:
              s=s.replace('</body>',helper+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'jgw-photo-storage-direct' in s
          assert 'JGWPhotoStorageDirect' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden photo storage status and migration [skip ci]"
          git push
