name: Test PlantNet name search

"on":
  push:
    paths:
      - '.github/workflows/test-plantnet-name-search.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          assert 'id="plantNameResults"' in s
          assert 'function searchPlantNetSpecies' in s
          assert 'https://my-api.plantnet.org/v2/species?' in s
          PY
          node --check /tmp/index.js
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Browser test with mocked PlantNet response
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt); d.set_window_size(390,844)
          try:
              d.get('http://127.0.0.1:8000/index.html')
              data={'plz':'','loc':None,'gardenCenter':None,'plants':[],'zones':[],'settings':{'plantnetKey':'TESTKEY123456','seasonMode':'auto','animations':True,'mapView':None,'onboardingDismissed':True},'days':30}
              d.execute_script("localStorage.setItem('giess_check_garten_v3', arguments[0])",json.dumps(data)); d.refresh(); time.sleep(1)
              d.execute_script("window.__realFetch=window.fetch; window.fetch=async function(url,opts){ if(String(url).includes('/v2/species?')) return {ok:true,status:200,json:async()=>[{commonNames:['Hortensie'],scientificNameWithoutAuthor:'Hydrangea macrophylla',family:'Hydrangeaceae'}]}; return window.__realFetch(url,opts); }")
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click(); document.getElementById('newPlantBtn').click();")
              inp=d.find_element(By.ID,'plantName'); inp.send_keys('Hor')
              WebDriverWait(d,4).until(EC.visibility_of_element_located((By.CSS_SELECTOR,'.plant-name-result')))
              result=d.find_element(By.CSS_SELECTOR,'.plant-name-result')
              assert 'Hortensie' in result.text and 'Hydrangea macrophylla' in result.text, result.text
              result.click(); time.sleep(.2)
              assert d.find_element(By.ID,'plantName').get_attribute('value')=='Hortensie'
              assert d.find_element(By.ID,'plantScientific').get_attribute('value')=='Hydrangea macrophylla'
              assert d.find_element(By.ID,'plantWater').get_attribute('value')=='high'
              assert 'übernommen' in d.find_element(By.ID,'plantNameAssist').text
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              print('PlantNet name search browser test: OK')
          finally:
              d.quit(); server.terminate(); server.wait(timeout=5)
          PY
