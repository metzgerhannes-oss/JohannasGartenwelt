name: Final UI Regression Audit

on:
  push:
    paths:
      - '.github/workflows/ui-regression-final.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und statischer Audit
        shell: bash
        run: |
          node --check garten-tipps.js
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          head=html.split('<script',1)[0]
          ids=re.findall(r'<button\b[^>]*\bid="([^"]+)"',head,re.I)
          dup=sorted({x for x in ids if ids.count(x)>1})
          print('STATIC_BUTTONS',len(ids))
          print('DUPLICATE_STATIC_IDS',dup)
          if dup: sys.exit(1)
          for required in ['today','plants','calendar','more']:
              if f'data-view="{required}"' not in head:
                  raise SystemExit('Navigation fehlt: '+required)
          if '<script src="./garten-tipps.js"></script>' not in html:
              raise SystemExit('Garten-Tipps nicht eingebunden')
          if 'window.scrollTo({top:0,left:0,behavior:"auto"})' not in html:
              raise SystemExit('Scroll-to-top in switchView fehlt')
          PY
      - name: Chromium bereitstellen
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Lokalen Server starten
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/jgw-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/jgw-http.log
          exit 1
      - name: UI im Browser prüfen
        shell: bash
        run: |
          cat > jgw-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
          page.on('dialog',async d=>{try{await d.dismiss()}catch(e){}});
          await page.addInitScript(()=>{
            const orig=EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener=function(type,fn,opt){
              try{
                if(type==='click'&&this instanceof Element)this.setAttribute('data-audit-click','1');
                if(type==='submit'&&this instanceof Element)this.setAttribute('data-audit-submit','1');
                if(type==='change'&&this instanceof Element)this.setAttribute('data-audit-change','1');
              }catch(e){}
              return orig.call(this,type,fn,opt);
            };
            localStorage.setItem('giess_check_garten_v3',JSON.stringify({
              plz:'',loc:null,gardenCenter:null,days:30,
              plants:[
                {id:'p1',name:'Lavendel',scientific:'Lavandula angustifolia',area:'Sonnenbeet',type:'bed',water:'low',size:'medium',quantity:2,bloomMonths:[6,7,8],ecoNative:'no',fertMonths:[4],cutMonths:[3,8],created:'2026-01-01'},
                {id:'p2',name:'Apfelbaum',scientific:'Malus domestica',area:'Obstwiese',type:'bed',water:'normal',size:'large',quantity:1,bloomMonths:[4,5],ecoNative:'no',fertMonths:[3,4],cutMonths:[2,3],created:'2025-01-01'}
              ],
              habitats:[{id:'h1',type:'deadwood',status:'present',area:'Sonnenbeet',notes:''}],
              animals:[{id:'a1',name:'Wildbiene',scientific:'',area:'Sonnenbeet',date:'2026-06-01',notes:''}],
              areas:[{id:'ar1',name:'Sonnenbeet'},{id:'ar2',name:'Obstwiese'}],
              zones:[{id:'z1',name:'Sonnenbeet',light:'sunny',rain:'open',soil:'normal',points:[{lat:48.5,lon:9.0},{lat:48.5001,lon:9.0},{lat:48.5001,lon:9.0001}]}],
              ecology:{practice:{noPesticides:true,leaveStemsInWinter:false,leavesPartlyRemain:false,peatFree:true,lessFrequentMowing:false,reducedNightLight:false}},
              settings:{seasonMode:'auto',animations:false,mapView:null,onboardingDismissed:true,plantView:'collection',plantSort:'name',natureTab:'plants',plantnetKey:''}
            }));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(800);
          const assert=(cond,msg)=>{if(!cond)throw new Error(msg)};
          // Genug Scrollraum unabhängig vom aktiven Bereich erzeugen.
          await page.evaluate(()=>{const s=document.createElement('div');s.id='auditSpacer';s.style.height='1800px';document.querySelector('#app').appendChild(s)});
          async function nav(view){
            await page.evaluate(()=>window.scrollTo(0,1000));
            await page.waitForTimeout(80);
            const before=await page.evaluate(()=>window.scrollY);
            assert(before>100,'Testseite konnte nicht gescrollt werden');
            await page.locator(`.tab[data-view="${view}"]`).evaluate(el=>el.click());
            await page.waitForTimeout(160);
            assert(await page.locator(`#view-${view}`).evaluate(el=>el.classList.contains('active')),`View ${view} nicht aktiv`);
            const after=await page.evaluate(()=>window.scrollY);
            console.log('NAV_SCROLL',view,before,'->',after);
            assert(after<=2,`Navigation ${view} blieb bei ScrollY ${after}`);
          }
          for(const v of ['today','plants','calendar','more']) await nav(v);

          // Mehr: Karte, Wetter, Einstellungen, Sync-Bereich und Garten-Tipps.
          await page.locator('.tab[data-view="more"]').evaluate(el=>el.click());
          for(const [id,target] of [['moreMapBtn','view-map'],['moreWeatherBtn','view-weather']]){
            await page.locator('#'+id).click(); await page.waitForTimeout(180);
            assert(await page.locator('#'+target).evaluate(el=>el.classList.contains('active')),id+' öffnet Ziel nicht');
            await page.locator('.tab[data-view="more"]').evaluate(el=>el.click()); await page.waitForTimeout(80);
          }
          await page.locator('#moreSettingsBtn').click(); await page.waitForTimeout(100);
          assert(!(await page.locator('#settingsOverlay').evaluate(el=>el.classList.contains('hidden'))),'Einstellungen öffnen fehlgeschlagen');
          await page.locator('#settingsClose').click();
          await page.locator('#moreSyncBtn').click(); await page.waitForTimeout(100);
          assert(!(await page.locator('#settingsOverlay').evaluate(el=>el.classList.contains('hidden'))),'Sync-Einstellungen öffnen fehlgeschlagen');
          await page.locator('#settingsClose').click();
          await page.locator('.tab[data-view="more"]').evaluate(el=>el.click());
          await page.locator('#moreAdvisorBtn').click(); await page.waitForTimeout(150);
          assert(await page.locator('#view-advisor').evaluate(el=>el.classList.contains('active')),'Garten-Tipps öffnen fehlgeschlagen');
          for(const mode of ['balance','animals','native','easy']) await page.locator(`#jga-body [data-m="${mode}"]`).click();
          await page.locator('#jga-zone').selectOption('z1');
          await page.locator('#jga-focus').selectOption('p1');
          await page.locator('#jga-refresh').click();

          // Pflanzen: alle Naturgarten-Unterbereiche und Pflanzeneditor.
          await page.locator('.tab[data-view="plants"]').evaluate(el=>el.click()); await page.waitForTimeout(120);
          for(const n of ['habitats','animals','plants']){
            const b=page.locator(`.nature-tab[data-nature="${n}"]`); assert(await b.count(),`Natur-Tab ${n} fehlt`); await b.click(); await page.waitForTimeout(80);
          }
          await page.locator('#newPlantBtn').click(); await page.waitForTimeout(100);
          assert(!(await page.locator('#plantEditor').evaluate(el=>el.classList.contains('hidden'))),'Pflanzeneditor öffnet nicht');
          await page.locator('#closePlantEditor').click();
          // Ansichts- und Sortiersteuerung.
          if(await page.locator('#plantViewList').count()) await page.locator('#plantViewList').click();
          if(await page.locator('#plantViewCollection').count()) await page.locator('#plantViewCollection').click();
          if(await page.locator('#plantSort').count()) await page.locator('#plantSort').selectOption('insect');

          // Aufgaben/Kalender.
          await page.locator('.tab[data-view="calendar"]').evaluate(el=>el.click()); await page.waitForTimeout(100);
          if(await page.locator('#calendarToggle').count()) await page.locator('#calendarToggle').click();

          // Globale Schnellaktionen.
          if(await page.locator('#quickAddPlant').count()){
            await page.locator('#quickAddPlant').click(); await page.waitForTimeout(80);
            if(!(await page.locator('#plantEditor').evaluate(el=>el.classList.contains('hidden')))) await page.locator('#closePlantEditor').click();
          }
          if(await page.locator('#settingsGear').count()){
            await page.locator('#settingsGear').click(); await page.waitForTimeout(80);
            assert(!(await page.locator('#settingsOverlay').evaluate(el=>el.classList.contains('hidden'))),'Zahnrad öffnet Einstellungen nicht');
            await page.locator('#settingsClose').click();
          }

          // Alle aktuell vorhandenen Buttons müssen entweder Click-Handler besitzen oder über ein Formular-Submit angebunden sein.
          const audit=await page.locator('button').evaluateAll(btns=>btns.map((b,i)=>({
            i,id:b.id||'',text:(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,80),type:b.type,
            bound:b.getAttribute('data-audit-click')==='1'||typeof b.onclick==='function'||(b.type==='submit'&&b.form&&b.form.getAttribute('data-audit-submit')==='1')
          })));
          const unbound=audit.filter(x=>!x.bound);
          console.log('BUTTON_TOTAL',audit.length);
          console.log('BUTTON_UNBOUND',JSON.stringify(unbound));
          assert(unbound.length===0,'Buttons ohne erkannte Aktion: '+JSON.stringify(unbound));

          // Alle sichtbaren Selects müssen an Change/Inline-Handler angebunden sein oder in einem Formular liegen.
          const selects=await page.locator('select').evaluateAll(xs=>xs.map(x=>({id:x.id||'',bound:x.getAttribute('data-audit-change')==='1'||typeof x.onchange==='function'||!!x.form})));
          const unboundSelects=selects.filter(x=>!x.bound);
          console.log('SELECT_TOTAL',selects.length);
          console.log('SELECT_UNBOUND',JSON.stringify(unboundSelects));

          const materialErrors=errors.filter(e=>!e.includes('favicon')&&!e.includes('ERR_')&&!e.includes('Failed to load resource'));
          console.log('JS_ERRORS',JSON.stringify(materialErrors));
          assert(materialErrors.length===0,'JavaScript-Konsolenfehler: '+materialErrors.join(' | '));
          console.log('AUDIT_OK');
          await browser.close();
          JS
          node ./jgw-audit.mjs | tee /tmp/jgw-audit.log
          grep -E 'NAV_SCROLL|BUTTON_TOTAL|BUTTON_UNBOUND|SELECT_TOTAL|SELECT_UNBOUND|JS_ERRORS|AUDIT_OK' /tmp/jgw-audit.log
