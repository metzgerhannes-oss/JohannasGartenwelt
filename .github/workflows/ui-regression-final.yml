name: Final UI Regression Audit

on:
  push:
    paths:
      - '.github/workflows/ui-regression-final.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und Struktur prüfen
        shell: bash
        run: |
          node --check garten-tipps.js
          node --check jgw-library-nav.js
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          head=html.split('<script',1)[0]
          ids=re.findall(r'<button\b[^>]*\bid="([^"]+)"',head,re.I)
          dup=sorted({x for x in ids if ids.count(x)>1})
          print('STATIC_BUTTONS',len(ids))
          print('DUPLICATE_STATIC_IDS',dup)
          if dup: sys.exit(1)
          for needle in ['<script src="./garten-tipps.js"></script>','<script src="./jgw-library-nav.js','window.scrollTo({top:0,left:0,behavior:"auto"})']:
              if needle not in html: raise SystemExit('Fehlt: '+needle)
          PY
      - name: Chromium bereitstellen
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: App starten und UI prüfen
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/jgw-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > jgw-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          page.setDefaultTimeout(5000);
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE: '+m.text())});
          page.on('dialog',async d=>{try{await d.dismiss()}catch(e){}});
          await page.addInitScript(()=>{
            const orig=EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener=function(type,fn,opt){
              try{
                if(type==='click'&&this instanceof Element)this.setAttribute('data-audit-click','1');
                if(type==='submit'&&this instanceof Element)this.setAttribute('data-audit-submit','1');
                if(type==='change'&&this instanceof Element)this.setAttribute('data-audit-change','1');
              }catch(e){}
              return orig.call(this,type,fn,opt);
            };
            localStorage.setItem('giess_check_garten_v3',JSON.stringify({
              plz:'',days:30,
              plants:[
                {id:'p1',name:'Lavendel',scientific:'Lavandula angustifolia',area:'Sonnenbeet',type:'bed',water:'low',size:'medium',quantity:2,bloomMonths:[6,7,8],ecoNative:'no',fertMonths:[4],cutMonths:[3,8],created:'2026-01-01'},
                {id:'p2',name:'Apfelbaum',scientific:'Malus domestica',area:'Obstwiese',type:'bed',water:'normal',size:'large',quantity:1,bloomMonths:[4,5],ecoNative:'no',fertMonths:[3,4],cutMonths:[2,3],created:'2025-01-01'}
              ],
              habitats:[{id:'h1',type:'deadwood',status:'present',area:'Sonnenbeet'}],
              animals:[{id:'a1',name:'Wildbiene',area:'Sonnenbeet',date:'2026-06-01'}],
              areas:[{id:'ar1',name:'Sonnenbeet'},{id:'ar2',name:'Obstwiese'}],
              zones:[{id:'z1',name:'Sonnenbeet',light:'sunny',rain:'open',soil:'normal',points:[{lat:48.5,lon:9},{lat:48.5001,lon:9},{lat:48.5001,lon:9.0001}]}],
              ecology:{practice:{noPesticides:true,peatFree:true}},
              settings:{seasonMode:'auto',animations:false,onboardingDismissed:true,plantView:'collection',plantSort:'name',natureTab:'plants',plantnetKey:''}
            }));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(700);
          const assert=(v,m)=>{if(!v)throw new Error(m)};

          await page.evaluate(()=>{window.__auditScrollCalls=[];window.scrollTo=function(a,b){window.__auditScrollCalls.push([a,b])}});
          async function nav(view){
            await page.evaluate(()=>window.__auditScrollCalls=[]);
            const b=page.locator(`.tabs > .tab[data-view="${view}"]`);
            assert(await b.count()===1,'Sichtbare Navigation '+view+' fehlt oder ist doppelt');
            await b.click(); await page.waitForTimeout(80);
            assert(await page.locator(`#view-${view}`).evaluate(e=>e.classList.contains('active')),'View '+view+' nicht aktiv');
            const calls=await page.evaluate(()=>window.__auditScrollCalls);
            const ok=calls.some(c=>(c[0]&&typeof c[0]==='object'&&Number(c[0].top)===0)||(Number(c[0])===0&&Number(c[1])===0));
            console.log('NAV_SCROLL',view,JSON.stringify(calls));
            assert(ok,'Navigation '+view+' scrollt nicht nach oben');
          }
          for(const v of ['plants','add','library','calendar','more'])await nav(v);

          await page.locator('.tabs > .tab[data-view="more"]').click();
          for(const [id,target] of [['moreMapBtn','view-map'],['moreWeatherBtn','view-weather']]){
            await page.locator('#'+id).click(); await page.waitForTimeout(100);
            assert(await page.locator('#'+target).evaluate(e=>e.classList.contains('active')),id+' öffnet Ziel nicht');
            await page.locator('.tabs > .tab[data-view="more"]').click();
          }
          for(const id of ['moreSettingsBtn','moreSyncBtn']){
            await page.locator('#'+id).click(); await page.waitForTimeout(70);
            assert(!(await page.locator('#settingsOverlay').evaluate(e=>e.classList.contains('hidden'))),id+' öffnet Einstellungen nicht');
            await page.locator('#settingsClose').click();
          }
          await page.locator('.tabs > .tab[data-view="more"]').click();
          await page.locator('#moreAdvisorBtn').click(); await page.waitForTimeout(100);
          assert(await page.locator('#view-advisor').evaluate(e=>e.classList.contains('active')),'Garten-Tipps öffnen nicht');
          for(const mode of ['balance','animals','native','easy'])await page.locator(`#jga-body [data-m="${mode}"]`).click();
          await page.locator('#jga-zone').selectOption('z1');
          await page.locator('#jga-focus').selectOption('p1');
          await page.locator('#jga-refresh').click();

          await page.locator('.tabs > .tab[data-view="plants"]').click();
          for(const n of ['habitats','animals','plants']){const b=page.locator(`.nature-tab[data-nature="${n}"]`);assert(await b.count()>0,'Natur-Tab '+n+' fehlt');await b.click()}
          await page.locator('#newPlantBtn').click();
          assert(!(await page.locator('#plantEditor').evaluate(e=>e.classList.contains('hidden'))),'Pflanzeneditor öffnet nicht');
          await page.locator('#closePlantEditor').click();
          if(await page.locator('#plantViewList').count())await page.locator('#plantViewList').click();
          if(await page.locator('#plantViewCollection').count())await page.locator('#plantViewCollection').click();
          if(await page.locator('#plantSort').count())await page.locator('#plantSort').selectOption('insect');

          await page.locator('.tabs > .tab[data-view="calendar"]').click();
          if(await page.locator('#calendarToggle').count())await page.locator('#calendarToggle').click();

          for(const id of ['quickAddPlant','settingsGear']){
            const x=page.locator('#'+id);
            if(await x.count()&&await x.isVisible()){
              await x.click(); await page.waitForTimeout(60);
              if(id==='quickAddPlant'&&await page.locator('#closePlantEditor').count()&&await page.locator('#closePlantEditor').isVisible())await page.locator('#closePlantEditor').click();
              if(id==='settingsGear'&&await page.locator('#settingsClose').isVisible())await page.locator('#settingsClose').click();
            }else if(await x.count())console.log('LEGACY_HIDDEN',id);
          }

          const audit=await page.locator('button').evaluateAll(bs=>bs.map((b,i)=>({i,id:b.id||'',text:(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,70),type:b.type,bound:b.getAttribute('data-audit-click')==='1'||typeof b.onclick==='function'||(b.type==='submit'&&b.form&&b.form.getAttribute('data-audit-submit')==='1')})));
          const unbound=audit.filter(x=>!x.bound);
          console.log('BUTTON_TOTAL',audit.length);
          console.log('BUTTON_UNBOUND',JSON.stringify(unbound));
          assert(unbound.length===0,'Buttons ohne Aktion: '+JSON.stringify(unbound));

          const selects=await page.locator('select').evaluateAll(xs=>xs.map(x=>({id:x.id||'',bound:x.getAttribute('data-audit-change')==='1'||typeof x.onchange==='function'||!!x.form})));
          console.log('SELECT_TOTAL',selects.length);
          console.log('SELECT_UNBOUND',JSON.stringify(selects.filter(x=>!x.bound)));

          const material=errors.filter(e=>!e.includes('favicon')&&!e.includes('ERR_')&&!e.includes('Failed to load resource'));
          console.log('JS_ERRORS',JSON.stringify(material));
          assert(material.length===0,'JavaScript-Fehler: '+material.join(' | '));
          console.log('AUDIT_OK');
          await browser.close();
          JS
          node ./jgw-audit.mjs | tee /tmp/jgw-audit.log
          grep -E 'NAV_SCROLL|LEGACY_HIDDEN|BUTTON_TOTAL|BUTTON_UNBOUND|SELECT_TOTAL|SELECT_UNBOUND|JS_ERRORS|AUDIT_OK' /tmp/jgw-audit.log
