name: Manual screenshots

on:
  push:
    paths:
      - '.github/workflows/manual-screenshots.yml'

jobs:
  capture:
    if: github.event.head_commit.message == 'Generate final manual screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Capture current app
        shell: bash
        run: |
          mkdir -p manual_screens
          python - <<'PY'
          import json, subprocess, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=430,932')
          d=webdriver.Chrome(options=opt); d.set_window_size(430,932)
          demo={
            'plz':'72144','loc':{'lat':48.53,'lon':9.14,'name':'Mössingen','state':'Baden-Württemberg'},'gardenCenter':{'lat':48.53,'lon':9.14},
            'plants':[
              {'id':'p1','name':'Lavendel','scientific':'Lavandula angustifolia','family':'Lamiaceae','area':'Südbeet','type':'bed','water':'low','size':'medium','favorite':True,'photo':'','bloomMonths':[6,7,8],'ecoNative':'no','ecoFlowerAccess':'open','fertMonths':[3,4],'cutMonths':[3,7],'created':'2026-04-12'},
              {'id':'p2','name':'Wilder Dost','scientific':'Origanum vulgare','family':'Lamiaceae','area':'Wildbeet','type':'bed','water':'low','size':'medium','favorite':True,'photo':'','bloomMonths':[7,8,9],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-05-20'},
              {'id':'p3','name':'Efeu','scientific':'Hedera helix','family':'Araliaceae','area':'Zaun','type':'bed','water':'normal','size':'large','favorite':False,'photo':'','bloomMonths':[9,10,11],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-03-10'},
              {'id':'p4','name':'Apfelbaum','scientific':'Malus domestica','family':'Rosaceae','area':'Obstwiese','type':'bed','water':'normal','size':'large','favorite':False,'photo':'','bloomMonths':[4,5],'ecoNative':'auto','ecoFlowerAccess':'open','fertMonths':[3,4],'cutMonths':[2,3,7,8],'created':'2026-02-18'},
              {'id':'p5','name':'Schneeglöckchen','scientific':'Galanthus nivalis','family':'Amaryllidaceae','area':'Unter dem Apfelbaum','type':'bed','water':'normal','size':'small','favorite':False,'photo':'','bloomMonths':[2,3],'ecoNative':'auto','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-02-01'},
              {'id':'p6','name':'Fetthenne','scientific':'Hylotelephium telephium','family':'Crassulaceae','area':'Terrassenbeet','type':'bed','water':'low','size':'medium','favorite':False,'photo':'','bloomMonths':[8,9,10],'ecoNative':'auto','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[3],'created':'2026-06-02'},
              {'id':'p7','name':'Hortensie','scientific':'Hydrangea macrophylla','family':'Hydrangeaceae','area':'Nordbeet','type':'bed','water':'high','size':'large','favorite':False,'photo':'','bloomMonths':[6,7,8,9],'ecoNative':'no','ecoFlowerAccess':'partial','fertMonths':[3,4,5,6,7],'cutMonths':[2,3],'created':'2026-04-20'},
              {'id':'p8','name':'Hundsrose','scientific':'Rosa canina','family':'Rosaceae','area':'Hecke','type':'bed','water':'normal','size':'large','favorite':True,'photo':'','bloomMonths':[5,6,7],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[3,4],'cutMonths':[3,4],'created':'2026-03-15'}
            ],
            'zones':[],
            'ecology':{'habitat':{'waterSource':True,'deadwood':True,'bareSoil':False,'wildCorner':True,'noPesticides':True,'nativePlantsFocus':True}},
            'settings':{'plantnetKey':'','seasonMode':'auto','animations':False,'mapView':{'lat':48.53,'lon':9.14,'zoom':19},'onboardingDismissed':True,'plantView':'collection','plantSort':'name'},'days':30
          }
          try:
              d.get('http://127.0.0.1:8000/index.html')
              d.execute_script("localStorage.setItem('giess_check_garten_v3', arguments[0])",json.dumps(demo))
              d.refresh(); time.sleep(3)
              d.save_screenshot('manual_screens/01_heute.png')

              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click()")
              time.sleep(.8)
              d.save_screenshot('manual_screens/02_pflanzen.png')

              d.execute_script("document.querySelector('#plantList .plantOpen').click()")
              WebDriverWait(d,3).until(EC.visibility_of_element_located((By.ID,'plantDetailOverlay')))
              time.sleep(.3)
              d.save_screenshot('manual_screens/03_pflanzenkarte.png')
              d.execute_script("document.getElementById('plantDetailClose').click()")

              d.execute_script("document.getElementById('newPlantBtn').click()")
              time.sleep(.4)
              d.execute_script("document.getElementById('plantAdvanced').open=true")
              d.execute_script("document.getElementById('plantEditor').scrollIntoView({block:'start'})")
              time.sleep(.3)
              d.save_screenshot('manual_screens/04_pflanze_hinzufuegen.png')
              d.execute_script("document.getElementById('closePlantEditor').click()")

              d.execute_script("document.querySelector('.tab[data-view=\"map\"]').click()")
              time.sleep(4)
              d.save_screenshot('manual_screens/05_karte.png')

              d.execute_script("document.querySelector('.tab[data-view=\"calendar\"]').click()")
              time.sleep(.5)
              d.save_screenshot('manual_screens/06_kalender.png')

              d.execute_script("document.getElementById('settingsGear').click()")
              time.sleep(.4)
              d.execute_script("document.getElementById('settingsEcology').scrollIntoView({block:'start'})")
              time.sleep(.3)
              d.save_screenshot('manual_screens/07_lebensraum.png')

              d.execute_script("document.getElementById('settingsClose').click()")
              d.execute_script("document.querySelector('.tab[data-view=\"weather\"]').click()")
              time.sleep(.8)
              d.save_screenshot('manual_screens/08_wetter.png')
          finally:
              d.quit(); server.terminate(); server.wait(timeout=5)
          PY
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: johannas-gartenwelt-manual-screens
          path: manual_screens/*.png
          if-no-files-found: error
