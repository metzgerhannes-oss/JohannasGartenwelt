name: Fix gallery mode weather and FAB
on:
  push:
    paths:
      - '.github/workflows/fix-gallery-mode-weather-fab.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) index: concise weather label, remove obsolete mobile name-footer hack, bump stable loader
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="state-label">Ohne wirksamen Regen</div><div class="state-value" id="gardenDryDays">–</div>',
                      '<div class="state-label">Trockenphase</div><div class="state-value" id="gardenDryDays">–</div>')
          s,n=re.subn(r'/\* JGW PLANT CARD FULL NAME FOOTER \*/.*?/\* /JGW PLANT CARD FULL NAME FOOTER \*/\s*', '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('obsolete full-name footer block not found')
          s,n=re.subn(r'jgw-library-nav\.js\?v=[^"\']+', 'jgw-library-nav.js?v=20260914-17', s, count=1)
          if n != 1:
              raise SystemExit('loader ref not found')
          p.write_text(s,encoding='utf-8')

          # 2) stable loader: force a fresh cleanup asset
          p=Path('jgw-library-nav.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('tag("jgw-ui-cleanup-20260914.js","20260914-3")','tag("jgw-ui-cleanup-20260914.js","20260914-4")')
          if 'jgw-ui-cleanup-20260914.js","20260914-4' not in s:
              raise SystemExit('cleanup version bump failed')
          p.write_text(s,encoding='utf-8')

          # 3) cleanup: migrate old saved list view once, dock add action into plant header, avoid card overlap
          p=Path('jgw-ui-cleanup-20260914.js')
          s=p.read_text(encoding='utf-8')
          marker='/* JGW UI CLEANUP V4 */'
          if marker not in s:
              extra=r'''
/* JGW UI CLEANUP V4 */
var polish=document.createElement("style");
polish.id="jgwUiCleanupV4";
polish.textContent=`
@media(max-width:700px){
  .state-item{min-width:0!important}
  .state-item .state-label{white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.08!important}
  #naturePlantsPane>.box:first-child .topline>.actions{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) 44px!important;
    gap:8px!important;
    align-items:center!important;
    width:100%!important;
  }
  #naturePlantsPane #plantSearch{
    grid-column:1!important;
    width:100%!important;
    min-width:0!important;
  }
  #naturePlantsPane #newPlantBtn{
    display:grid!important;
    place-items:center!important;
    grid-column:2!important;
    width:44px!important;
    min-width:44px!important;
    height:44px!important;
    min-height:44px!important;
    padding:0!important;
    border-radius:50%!important;
    font-size:0!important;
  }
  #naturePlantsPane #newPlantBtn::before{
    content:"+";
    font-size:24px!important;
    line-height:1!important;
  }
  body:has(#view-plants.active) .jgw-fab{display:none!important}
}
`;
document.head.appendChild(polish);

function migratePlantGalleryView(){
  try{
    var s=window.JGWCore&&JGWCore.getState?JGWCore.getState():window.state;
    if(!s||!s.settings||s.settings.galleryViewV2)return;
    s.settings.galleryViewV2=true;
    var b=document.getElementById("plantViewCollection");
    if(b)b.click();
  }catch(e){console.warn("Galerie-Migration übersprungen",e)}
}
setTimeout(migratePlantGalleryView,2200);
setTimeout(migratePlantGalleryView,5000);
window.addEventListener("pageshow",function(){setTimeout(migratePlantGalleryView,350)});
/* /JGW UI CLEANUP V4 */
'''
              anchor='document.head.appendChild(css);\n})();'
              if anchor not in s:
                  raise SystemExit('cleanup anchor missing')
              s=s.replace(anchor,'document.head.appendChild(css);\n'+extra+'\n})();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'Trockenphase' index.html
          ! grep -q 'JGW PLANT CARD FULL NAME FOOTER' index.html
          grep -q 'jgw-library-nav.js?v=20260914-17' index.html
          grep -q 'jgw-ui-cleanup-20260914.js","20260914-4' jgw-library-nav.js
          grep -q 'galleryViewV2' jgw-ui-cleanup-20260914.js
          grep -q 'body:has(#view-plants.active) .jgw-fab' jgw-ui-cleanup-20260914.js
          node --check jgw-library-nav.js
          node --check jgw-ui-cleanup-20260914.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html jgw-library-nav.js jgw-ui-cleanup-20260914.js
          git commit -m 'Galerieansicht aktivieren und mobile UI korrigieren'
          git push
