name: Apply photo storage integration

on:
  push:
    paths:
      - '.github/workflows/apply-photo-storage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div class="actions" style="margin-top:14px"><button class="btn" type="submit">Speichern</button><button class="btn secondary" id="saveAndPlaceBtn" type="button">Speichern & auf Karte setzen</button><button class="btn secondary hidden" id="removePlantMapBtn" type="button">Von Karte entfernen</button><button class="btn danger hidden" id="deletePlantBtn" type="button">Pflanze löschen</button></div>'
          new='<div class="actions" style="margin-top:14px"><button class="btn" id="saveAndPlaceBtn" type="button">Fertig + auf Karte platzieren</button><button class="btn secondary" type="submit">Fertig</button><button class="btn secondary hidden" id="removePlantMapBtn" type="button">Von Karte entfernen</button><button class="btn danger hidden" id="deletePlantBtn" type="button">Pflanze löschen</button></div>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="saveAndPlaceBtn"' not in s:
              raise SystemExit('Plant action block not found')

          s=s.replace('var max=720,w=img.width,h=img.height','var max=560,w=img.width,h=img.height')
          s=s.replace('toDataURL("image/jpeg",.72)','toDataURL("image/jpeg",.62)')

          tag='<script src="./garten-tipps.js"></script>'
          replacement='<script src="./garten-tipps.js?v=20260913-3"></script>\n<script src="./photo-storage.js?v=20260913-1"></script>'
          if './photo-storage.js' not in s:
              if tag not in s:
                  raise SystemExit('garten-tipps script tag not found')
              s=s.replace(tag,replacement,1)
          else:
              s=s.replace(tag,'<script src="./garten-tipps.js?v=20260913-3"></script>',1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check photo-storage.js
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate cloud photo storage [skip ci]"
          git push
