name: Vendor Vokabeltrainer Wikidict

on:
  push:
    paths:
      - '.github/workflows/vendor-vokabeltrainer-wikidict.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dictionary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CC0 German-English dictionary shards
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vokabeltrainer/dict/wikidict
          mkdir -p vokabeltrainer/dict/wikidict
          python - <<'PY'
          import json, re, unicodedata, urllib.request
          from pathlib import Path
          from collections import defaultdict

          URL='https://raw.githubusercontent.com/open-dict-data/wikidict-en/master/data/de-en_wiki.txt'
          OUT=Path('vokabeltrainer/dict/wikidict')
          de_en=defaultdict(list)
          en_de=defaultdict(list)

          def norm(s):
              s=unicodedata.normalize('NFKC',s).lower()
              s=s.translate(str.maketrans({'ä':'ae','ö':'oe','ü':'ue','ß':'ss','’':"'",'‘':"'",'`':"'",'´':"'"}))
              s=re.sub(r'[(){}\[\]]',' ',s)
              s=re.sub(r'[.,!?;:]+',' ',s)
              s=re.sub(r'\s+',' ',s).strip()
              return s

          def ok(s):
              s=s.strip()
              return 1 <= len(s) <= 80 and len(s.split()) <= 8 and '\x00' not in s

          def add(store, src, dst):
              key=norm(src)
              if not key or not ok(src) or not ok(dst):
                  return
              vals=store[key]
              if dst not in vals and len(vals)<4:
                  vals.append(dst)

          with urllib.request.urlopen(URL, timeout=120) as r:
              for raw in r:
                  line=raw.decode('utf-8','ignore').rstrip('\r\n')
                  if '\t' not in line:
                      continue
                  de,en=line.split('\t',1)
                  de,en=de.strip(),en.strip()
                  if not de or not en:
                      continue
                  add(de_en,de,en)
                  add(en_de,en,de)

          def shard_key(key):
              simple=re.sub(r'[^a-z0-9]','',key)
              if not simple:
                  return '__'
              first=simple[0]
              second=simple[1] if len(simple)>1 else '_'
              if 'a' <= second <= 'd': bucket='a'
              elif 'e' <= second <= 'h': bucket='e'
              elif 'i' <= second <= 'l': bucket='i'
              elif 'm' <= second <= 'p': bucket='m'
              elif 'q' <= second <= 't': bucket='q'
              elif 'u' <= second <= 'x': bucket='u'
              elif second.isalnum(): bucket='y'
              else: bucket='_'
              return first+bucket

          for direction,store in [('de-en',de_en),('en-de',en_de)]:
              groups=defaultdict(dict)
              for key,vals in store.items():
                  groups[shard_key(key)][key]=vals
              base=OUT/direction
              base.mkdir(parents=True,exist_ok=True)
              for shard,data in groups.items():
                  (base/f'{shard}.json').write_text(
                      json.dumps(data,ensure_ascii=False,separators=(',',':')),
                      encoding='utf-8'
                  )

          (OUT/'README.txt').write_text(
              'Wikidict bilingual reference data derived from Wikidata.\n'
              'Source: https://github.com/open-dict-data/wikidict-en\n'
              'License: CC0 1.0 / public-domain dedication.\n'
              'The Vokabeltrainer stores normalized lookup shards generated from de-en_wiki.txt.\n',
              encoding='utf-8'
          )
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/open-dict-data/wikidict-en/master/LICENSE',
              OUT/'LICENSE-CC0.txt'
          )
          print('de-en keys',len(de_en),'en-de keys',len(en_de))
          print('files',sum(1 for _ in OUT.rglob('*.json')))
          PY
      - name: Commit dictionary shards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vokabeltrainer/dict/wikidict
          if git diff --cached --quiet; then
            echo "Dictionary already current."
            exit 0
          fi
          git commit -m "Vokabeltrainer: lokales CC0-Hybridwörterbuch"
          git push