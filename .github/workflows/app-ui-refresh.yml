name: Final garden audit

on:
  push:
    paths:
      - '.github/workflows/app-ui-refresh.yml'
      - 'index.html'
      - 'setup.html'
      - 'jgw-library-nav.js'
      - 'jgw-ux-shell.js'
      - 'jgw-library-v4.js'
      - 'jgw-ux-patch.js'
      - 'jgw-photo-storage-v2.js'
      - 'garten-tipps.js'
      - 'photo-storage.js'
      - 'tools/runtime_efficiency_audit.py'
      - 'tools/ux_v4_audit.py'
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and asset checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          for fn in ['index.html','setup.html']:
              s=Path(fn).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              Path('/tmp/'+fn+'.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
              assert 'JGW FINAL DESIGN' in s
          idx=Path('index.html').read_text(encoding='utf-8')
          setup=Path('setup.html').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          json.loads(Path('setup.webmanifest').read_text(encoding='utf-8'))
          assert 'font-family:-apple-system' in idx
          assert 'min-height:52px' in idx
          assert '<link rel="apple-touch-icon" href="./app-icon-180.png">' in setup
          assert '<link rel="icon" href="./app-icon.svg" type="image/svg+xml">' in setup
          assert 'id="setupGuide"' in idx
          assert 'id="plantAdvanced"' in idx
          assert 'id="calendarToggle"' in idx
          assert 'function renderOnboardingGuide()' in idx
          PY
          node --check /tmp/index.html.js
          node --check /tmp/setup.html.js
          for js in jgw-library-nav.js jgw-ux-shell.js jgw-library-v4.js jgw-ux-patch.js jgw-photo-storage-v2.js garten-tipps.js photo-storage.js; do
            test ! -f "$js" || node --check "$js"
          done
          python -m py_compile tools/runtime_efficiency_audit.py tools/ux_v4_audit.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type checks
        run: |
          deno check supabase/functions/jgw-photo/index.ts
          deno check supabase/functions/trefle-enrich/index.ts
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Runtime and efficiency audit
        run: python tools/runtime_efficiency_audit.py
      - name: Upload audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: johannas-gartenwelt-runtime-audit
          path: audit_runtime
          if-no-files-found: warn
          retention-days: 14
