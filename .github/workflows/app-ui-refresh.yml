name: Final garden audit

on:
  push:
    paths:
      - '.github/workflows/app-ui-refresh.yml'
      - 'index.html'
      - 'setup.html'
      - 'manifest.webmanifest'
      - 'setup.webmanifest'
      - 'jgw-library-nav.js'
      - 'jgw-ux-shell.js'
      - 'jgw-library-v4.js'
      - 'jgw-ux-patch.js'
      - 'jgw-photo-storage-v2.js'
      - 'jgw-ui-cleanup-20260914.js'
      - 'jgw-mobile-fix-v5.js'
      - 'garten-tipps.js'
      - 'jgw-care-calendar-v1.js'
      - 'jgw-task-bulk-v3.js'
      - 'jgw-hardiness-data-v1.js'
      - 'jgw-hardiness-v2.js'
      - 'jgw-hardiness-labels-v1.js'
      - 'photo-storage.js'
      - 'tools/core_runtime_smoke.py'
      - 'tools/runtime_efficiency_audit.py'
      - 'tools/ux_v4_audit.py'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase_setup.sql'

permissions:
  contents: read

concurrency:
  group: final-garden-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and asset checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          for fn in ['index.html','setup.html']:
              s=Path(fn).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              Path('/tmp/'+fn+'.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
              assert 'JGW FINAL DESIGN' in s
          idx=Path('index.html').read_text(encoding='utf-8')
          setup=Path('setup.html').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          json.loads(Path('setup.webmanifest').read_text(encoding='utf-8'))
          assert 'font-family:-apple-system' in idx
          assert 'min-height:52px' in idx
          assert '<link rel="apple-touch-icon" href="./app-icon-180.png">' in setup
          assert '<link rel="icon" href="./app-icon.svg" type="image/svg+xml">' in setup
          assert 'id="setupGuide"' in idx
          assert 'id="plantAdvanced"' in idx
          assert 'id="calendarToggle"' in idx
          assert 'function renderOnboardingGuide()' in idx
          PY
          node --check /tmp/index.html.js
          node --check /tmp/setup.html.js
          for js in jgw-library-nav.js jgw-ux-shell.js jgw-library-v4.js jgw-ux-patch.js jgw-photo-storage-v2.js jgw-ui-cleanup-20260914.js jgw-mobile-fix-v5.js garten-tipps.js jgw-care-calendar-v1.js jgw-task-bulk-v3.js jgw-hardiness-data-v1.js jgw-hardiness-v2.js jgw-hardiness-labels-v1.js photo-storage.js; do
            test ! -f "$js" || node --check "$js"
          done
          python -m py_compile tools/core_runtime_smoke.py tools/runtime_efficiency_audit.py tools/ux_v4_audit.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type checks
        run: |
          deno check supabase/functions/jgw-photo/index.ts
          deno check supabase/functions/trefle-enrich/index.ts
          deno check supabase/functions/jgw-calendar/index.ts
      - name: Headless Chrome DOM smoke test
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          rm -rf /tmp/jgw-chrome
          set +e
          timeout 20s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-component-update --disable-sync --no-first-run --allow-file-access-from-files --user-data-dir=/tmp/jgw-chrome --virtual-time-budget=5000 --dump-dom "file://$PWD/index.html?audit=1" > /tmp/jgw-dom.html
          CHROME_RC=$?
          set -e
          if [ "$CHROME_RC" -ne 0 ] && [ "$CHROME_RC" -ne 124 ]; then
            exit "$CHROME_RC"
          fi
          test -s /tmp/jgw-dom.html
          grep -q 'data-view="today"' /tmp/jgw-dom.html
          grep -q 'data-view="plants"' /tmp/jgw-dom.html
          grep -q 'data-view="calendar"' /tmp/jgw-dom.html
          grep -q 'data-view="library"' /tmp/jgw-dom.html
          grep -q 'data-view="more"' /tmp/jgw-dom.html
          grep -q 'class="jgw-fab"' /tmp/jgw-dom.html
          grep -q 'id="view-library"' /tmp/jgw-dom.html
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Core browser smoke test (diagnostic)
        id: core_browser
        continue-on-error: true
        timeout-minutes: 1
        run: python tools/core_runtime_smoke.py
      - name: UX browser audit (diagnostic)
        if: steps.core_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: python tools/ux_v4_audit.py
      - name: Upload audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: johannas-gartenwelt-runtime-audit
          path: audit_runtime
          if-no-files-found: warn
          retention-days: 14
