name: Garden CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: garden-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Static syntax and asset checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          idx=Path('index.html').read_text(encoding='utf-8')
          setup=Path('setup.html').read_text(encoding='utf-8')
          app_css=Path('jgw-app.css').read_text(encoding='utf-8')
          runtime_css=Path('jgw-runtime-styles.css').read_text(encoding='utf-8')
          app_js=Path('jgw-app.js').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          json.loads(Path('setup.webmanifest').read_text(encoding='utf-8'))
          assert 'JGW FINAL DESIGN' in app_css
          assert 'font-family:-apple-system' in app_css
          assert 'min-height:52px' in app_css or 'min-height:52px' in runtime_css
          assert '<link rel="apple-touch-icon" href="./app-icon-180.png">' in setup
          assert '<link rel="icon" href="./app-icon.svg" type="image/svg+xml">' in setup
          assert 'id="setupGuide"' in idx
          assert 'id="plantAdvanced"' in idx
          assert 'id="calendarToggle"' in idx
          assert 'function renderOnboardingGuide()' in app_js
          PY
          node scripts/csp-static-audit.mjs
          for js in jgw-app.js jgw-sw-register.js setup.js sw.js jgw-ux-shell.js jgw-library-v4.js jgw-ux-patch.js jgw-photo-storage-v2.js jgw-ui-cleanup-20260914.js jgw-mobile-fix-v5.js garten-tipps.js jgw-care-calendar-v1.js jgw-task-bulk-v3.js jgw-hardiness-data-v1.js jgw-hardiness-v2.js jgw-hardiness-labels-v1.js vendor/leaflet/leaflet-1.9.4.js vendor/leaflet-draw/leaflet.draw-1.0.4.js vendor/qrcode/qrcode-1.0.0.min.js; do
            test ! -f "$js" || node --check "$js"
          done
          python -m py_compile tools/core_runtime_smoke.py tools/runtime_efficiency_audit.py tools/ux_v4_audit.py
      - name: Supabase recovery source audit
        run: node scripts/supabase-recovery-audit.mjs

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Edge Function type checks
        run: |
          deno check supabase/functions/jgw-photo/index.ts
          deno check supabase/functions/trefle-enrich/index.ts
          deno check supabase/functions/jgw-calendar/index.ts
          deno check supabase/functions/muell-moessingen/index.ts
      - name: Install Playwright Chromium
        run: |
          cp .github/browser-ci/package.json package.json
          npm install --package-lock-only --ignore-scripts
          echo "JGW_LOCK_B64=$(base64 -w0 package-lock.json)"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Start local server for Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jgw-http-chromium.log 2>&1 &
          echo $! > /tmp/jgw-http-chromium.pid
          sleep 2

      - name: Chromium iPhone functional smoke
        timeout-minutes: 2
        run: JGW_BROWSER=chromium JGW_BASE=http://127.0.0.1:4173 node scripts/csp-webkit-smoke.mjs

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Static CSP audit
        run: node scripts/csp-static-audit.mjs

      - name: JavaScript syntax check
        run: |
          node --check jgw-app.js
          node --check jgw-sw-register.js
          node --check jgw-ux-shell.js
          node --check jgw-library-v4.js
          node --check jgw-ux-patch.js
          node --check jgw-photo-storage-v2.js
          node --check jgw-ui-cleanup-20260914.js
          node --check jgw-mobile-fix-v5.js
          node --check jgw-hardiness-data-v1.js
          node --check jgw-hardiness-v2.js
          node --check jgw-hardiness-labels-v1.js
          node --check garten-tipps.js
          node --check jgw-care-calendar-v1.js
          node --check jgw-task-bulk-v3.js
          node --check sw.js
          node --check setup.js
          node --check vendor/leaflet/leaflet-1.9.4.js
          node --check vendor/leaflet-draw/leaflet.draw-1.0.4.js
          node --check vendor/qrcode/qrcode-1.0.0.min.js

      - name: Install Playwright WebKit
        run: |
          cp .github/browser-ci/package.json package.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npx playwright install --with-deps webkit

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jgw-http.log 2>&1 &
          echo $! > /tmp/jgw-http.pid
          sleep 2

      - name: WebKit iPhone smoke test
        timeout-minutes: 2
        run: JGW_BROWSER=webkit JGW_BASE=http://127.0.0.1:4173 node scripts/csp-webkit-smoke.mjs
