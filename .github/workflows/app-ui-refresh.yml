name: Refresh garden UI

on:
  push:
    paths:
      - '.github/workflows/app-ui-refresh.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply seasonal garden UX
        run: python tools/app_ui_refresh.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/jgw.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/jgw.js
      - name: Commit refreshed UI
        shell: bash
        run: |
          git config user.name "Johannas Gartenwelt Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add seasonal design, fixed garden map and comfort UX"
          git push
