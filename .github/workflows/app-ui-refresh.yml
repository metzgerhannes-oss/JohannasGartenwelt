name: Final garden audit

on:
  push:
    paths:
      - '.github/workflows/app-ui-refresh.yml'
      - 'tools/final_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax and asset checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          for fn in ['index.html','setup.html']:
              s=Path(fn).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              Path('/tmp/'+fn+'.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
              assert 'JGW FINAL DESIGN' in s
          idx=Path('index.html').read_text(encoding='utf-8')
          setup=Path('setup.html').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert 'font-family:-apple-system' in idx
          assert 'min-height:52px' in idx
          assert '<link rel="apple-touch-icon" href="./app-icon-180.png">' in setup
          assert '<link rel="icon" href="./app-icon.svg" type="image/svg+xml">' in setup
          assert 'id="setupGuide"' in idx
          assert 'id="plantAdvanced"' in idx
          assert 'id="calendarToggle"' in idx
          assert 'function renderOnboardingGuide()' in idx
          assert 'id="setGardenCenterBtn"' not in idx
          assert 'id="openGardenCenter"' not in idx
          PY
          node --check /tmp/index.html.js
          node --check /tmp/setup.html.js
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Browser, usability and external-service smoke test
        run: python tools/final_audit.py
      - name: Upload audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: johannas-gartenwelt-final-audit
          path: audit_artifacts
          if-no-files-found: warn
          retention-days: 14
