name: Refresh garden UI

on:
  push:
    paths:
      - '.github/workflows/app-ui-refresh.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile UX polish
        run: python tools/app_ux_polish_runner.py
      - name: Check JavaScript and PWA assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/jgw.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert Path('app-icon-180.png').read_bytes().startswith(b'\x89PNG')
          assert 'JGW UX V3' in s
          assert 'id="setupGuide"' in s
          assert 'id="plantAdvanced"' in s
          assert 'id="calendarToggle"' in s
          assert 'function renderOnboardingGuide()' in s
          assert 'id="setGardenCenterBtn"' not in s
          assert 'id="openGardenCenter"' not in s
          PY
          node --check /tmp/jgw.js
      - name: Commit polished app
        shell: bash
        run: |
          git config user.name "Johannas Gartenwelt Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html manifest.webmanifest app-icon.svg app-icon-180.png
          git commit -m "Polish mobile navigation, onboarding and daily usability"
          git push
