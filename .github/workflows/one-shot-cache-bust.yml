name: One-shot cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update garten-tipps cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './garten-tipps.js?v=20260914-2'
          new = './garten-tipps.js?v=20260917-4'
          if old not in s:
              raise SystemExit(f'Expected reference not found: {old}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force refresh of garden task fixes"
          git push
