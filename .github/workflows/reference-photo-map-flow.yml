name: Reference photos and map placement flow

"on":
  push:
    paths:
      - '.github/workflows/reference-photo-map-flow.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upgrade
        run: python tools/reference_photos_and_map_flow.py
      - name: Validate syntax and flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in [
            'function plantPhotoInfo',
            'Referenz · iNaturalist',
            'refPhoto:rp.medium_url',
            'function backfillPlantReferencePhotos',
            'function finishNaturePlacement',
            'finishNaturePlacement("plant",id',
            'finishNaturePlacement("habitat",hid',
            'finishNaturePlacement("animal",aid',
            'Zurück in Naturgarten'
          ]:
              assert marker in s, marker
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Check iNaturalist reference image
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q='Buddleja davidii'
          u='https://api.inaturalist.org/v1/taxa/autocomplete?'+urllib.parse.urlencode({'q':q,'taxon_id':47126,'locale':'de','per_page':6})
          req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'JohannasGartenwelt/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
          t=next((x for x in d.get('results',[]) if x.get('name','').lower()==q.lower()),None)
          assert t and t.get('default_photo'), t
          ph=t['default_photo']
          assert ph.get('medium_url') or ph.get('square_url'), ph
          print('reference image OK:',ph.get('medium_url') or ph.get('square_url'))
          PY
      - name: Commit and clean temporary files
        shell: bash
        run: |
          rm -f tools/reference_photos_and_map_flow.py .github/workflows/reference-photo-map-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add plant reference photos and smooth map placement flow"
          git push origin main
