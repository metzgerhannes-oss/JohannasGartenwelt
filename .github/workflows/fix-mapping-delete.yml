name: Fix mapping status and deletion controls

"on":
  push:
    paths:
      - '.github/workflows/fix-mapping-delete.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python tools/fix_mapping_and_delete.py
      - name: Validate syntax and structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in [
            'function plantMapStatus',
            'auf Karte positioniert',
            'id="deletePlantBtn"',
            'id="deleteHabitatBtn"',
            'id="deleteAnimalBtn"',
            'id="removePlantMapBtn"',
            'id="removeHabitatMapBtn"',
            'id="removeAnimalMapBtn"',
            'function deleteHabitatEntry',
            'function deleteAnimalObservation'
          ]:
              assert marker in s, marker
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Mobile mapping and delete smoke test
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options();opt.add_argument('--headless=new');opt.add_argument('--no-sandbox');opt.add_argument('--disable-dev-shm-usage');opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt);d.set_window_size(390,844)
          wait=WebDriverWait(d,15)
          try:
              d.get('http://127.0.0.1:8000/index.html')
              wait.until(lambda x:x.find_elements(By.CSS_SELECTOR,'.tab[data-view="plants"]'))
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click();document.getElementById('newPlantBtn').click()")
              wait.until(EC.visibility_of_element_located((By.ID,'plantName'))).send_keys('X')
              d.find_element(By.ID,'saveAndPlaceBtn').click()
              m=wait.until(EC.visibility_of_element_located((By.ID,'map')))
              time.sleep(1)
              ActionChains(d).move_to_element_with_offset(m,120,120).click().perform()
              time.sleep(.7)
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click()")
              card=wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR,'.plantOpen')))
              d.execute_script('arguments[0].click()',card)
              wait.until(EC.visibility_of_element_located((By.ID,'plantDetailOverlay')))
              detail=d.find_element(By.ID,'plantDetailContent').text
              print('mapped detail:',detail)
              assert 'auf Karte positioniert' in detail, detail
              edit=d.find_element(By.CSS_SELECTOR,'.detailEdit');d.execute_script('arguments[0].click()',edit)
              wait.until(EC.visibility_of_element_located((By.ID,'plantEditor')))
              assert d.find_element(By.ID,'deletePlantBtn').is_displayed()
              assert d.find_element(By.ID,'removePlantMapBtn').is_displayed()
              d.find_element(By.ID,'removePlantMapBtn').click();time.sleep(.4)
              assert not d.find_element(By.ID,'removePlantMapBtn').is_displayed()
              d.find_element(By.ID,'closePlantEditor').click()
              card=wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR,'.plantOpen')));d.execute_script('arguments[0].click()',card)
              assert 'nicht kartiert' in d.find_element(By.ID,'plantDetailContent').text
              edit=d.find_element(By.CSS_SELECTOR,'.detailEdit');d.execute_script('arguments[0].click()',edit)
              wait.until(EC.element_to_be_clickable((By.ID,'deletePlantBtn'))).click()
              wait.until(EC.alert_is_present());d.switch_to.alert.accept();time.sleep(.5)
              assert 'Noch keine Pflanzen gespeichert' in d.find_element(By.ID,'plantList').text
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              print('mobile mapping/delete smoke test OK')
          finally:
              d.quit();server.terminate();server.wait(timeout=5)
          PY
      - name: Commit and clean temporary files
        shell: bash
        run: |
          rm -f tools/fix_mapping_and_delete.py .github/workflows/fix-mapping-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mapped status and add clear delete controls"
          git push origin main
