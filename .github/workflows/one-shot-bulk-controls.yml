name: One-shot bulk controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-bulk-controls.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent bulk task script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./garten-tipps.js?v=20260917-5"></script>'
          new=old+'\n<script src="./jgw-task-bulk-v3.js?v=20260917-1"></script>'
          if 'jgw-task-bulk-v3.js' in s:
              raise SystemExit('bulk script already present')
          if old not in s:
              raise SystemExit('garten-tipps reference not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit bulk controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load persistent bulk task controls"
          git push
