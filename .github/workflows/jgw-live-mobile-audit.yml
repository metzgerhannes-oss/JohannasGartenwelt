name: One-time live mobile interaction audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jgw-live-mobile-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Test published app in mobile Chrome
        shell: bash
        run: |
          cat > /tmp/live_audit.py <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          BASE='https://metzgerhannes-oss.github.io/JohannasGartenwelt/'
          o=webdriver.ChromeOptions()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--lang=de-DE']:
              o.add_argument(a)
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o); d.set_window_size(390,844)
          w=WebDriverWait(d,25)

          def click(css):
              x=w.until(EC.presence_of_element_located((By.CSS_SELECTOR,css)))
              d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[0].click()",x)
              time.sleep(.15); return x
          def active(view):
              return d.execute_script("return document.getElementById(arguments[0]).classList.contains('active')",'view-'+view)
          def visible(id):
              return d.execute_script("var x=document.getElementById(arguments[0]);return !!x&&!x.classList.contains('hidden')",id)
          def assertx(v,msg):
              if not v: raise AssertionError(msg)

          try:
              d.get(BASE+'?liveaudit='+str(int(time.time())))
              w.until(lambda z: len(z.find_elements(By.CSS_SELECTOR,'.tabs > .tab'))==5)
              sample={
                'plants':[{'id':'p-audit','name':'Audit-Lavendel','scientific':'Lavandula angustifolia','quantity':2,'area':'Auditbeet','careMeta':{}}],
                'habitats':[{'id':'h-audit','type':'deadwood','status':'present','area':'Auditecke'}],
                'animals':[{'id':'a-audit','name':'Audit-Igel','scientific':'Erinaceus europaeus','group':'mammal','date':'2026-09-12'}],
                'areas':[],'zones':[],'ecology':{},'settings':{'natureTab':'plants'},'days':30
              }
              d.execute_script("localStorage.setItem('giess_check_garten_v3',arguments[0])",json.dumps(sample))
              d.refresh()
              w.until(lambda z: len(z.find_elements(By.CSS_SELECTOR,'.tabs > .tab'))==5)
              time.sleep(.4)

              labels=[x.find_elements(By.CSS_SELECTOR,'span')[-1].text.strip() for x in d.find_elements(By.CSS_SELECTOR,'.tabs > .tab')]
              assertx(labels==['Mein Garten','Hinzufügen','Bibliothek','Aufgaben','Mehr'],'Hauptnavigation falsch: '+repr(labels))
              print('PASS Hauptnavigation',labels)

              click('.tabs > .tab[data-view="plants"]'); assertx(active('plants'),'Mein Garten öffnet nicht')
              click('.nature-tab[data-nature="plants"]'); assertx(visible('naturePlantsPane'),'Pflanzen-Pane nicht sichtbar')
              click('.nature-tab[data-nature="habitats"]'); assertx(visible('natureHabitatsPane'),'Lebensräume-Pane nicht sichtbar')
              click('.nature-tab[data-nature="animals"]'); assertx(visible('natureAnimalsPane'),'Beobachtungen-Pane nicht sichtbar')
              print('PASS Mein Garten: Pflanzen / Lebensräume / Beobachtungen')

              click('.tabs > .tab[data-view="library"]'); assertx(active('library'),'Bibliothek öffnet nicht')
              assertx(d.find_element(By.ID,'jgwLibraryScope').get_attribute('aria-checked')=='true','Mein Garten nicht standardmäßig aktiv')
              click('#jgwLibraryPlants');
              w.until(lambda z: len(z.find_elements(By.CSS_SELECTOR,'#jgwLibraryGrid .jgw-own-plant'))==1)
              assertx('Audit-Lavendel' in d.find_element(By.ID,'jgwLibraryGrid').text,'Eigene Pflanze fehlt')
              click('#jgwLibraryGrid .jgw-own-plant'); assertx(not d.find_element(By.ID,'plantDetailOverlay').get_attribute('class').find('hidden')>=0,'Pflanzendetail öffnet nicht')
              click('#plantDetailClose')
              click('#jgwLibraryAnimals');
              w.until(lambda z: len(z.find_elements(By.CSS_SELECTOR,'#jgwLibraryGrid .jgw-own-animal'))==1)
              assertx('Audit-Igel' in d.find_element(By.ID,'jgwLibraryGrid').text,'Eigenes Tier fehlt')
              click('#jgwLibraryGrid .jgw-own-animal'); assertx('hidden' not in d.find_element(By.ID,'plantDetailOverlay').get_attribute('class'),'Tierdetail öffnet nicht')
              click('#plantDetailClose')
              click('#jgwLibraryScope'); assertx(d.find_element(By.ID,'jgwLibraryScope').get_attribute('aria-checked')=='false','Mein Garten AUS reagiert nicht')
              w.until(lambda z: len(z.find_elements(By.CSS_SELECTOR,'#jgwLibraryGrid .jgw-library-card'))>0)
              click('#jgwLibraryPlants'); assertx(len(d.find_elements(By.CSS_SELECTOR,'#jgwLibraryGrid .jgw-library-card'))>0,'Stöbern Pflanzen leer')
              click('#jgwLibraryAnimals'); assertx(len(d.find_elements(By.CSS_SELECTOR,'#jgwLibraryGrid .jgw-library-card'))>0,'Stöbern Tiere leer')
              click('#jgwLibraryScope'); assertx(d.find_element(By.ID,'jgwLibraryScope').get_attribute('aria-checked')=='true','Mein Garten EIN reagiert nicht')
              print('PASS Bibliothek: eigener Garten / Pflanzen / Tiere / Stöbern / Details')

              click('.tabs > .tab[data-view="add"]'); assertx(active('add'),'Hinzufügen öffnet nicht'); assertx(len(d.find_elements(By.CSS_SELECTOR,'.jgw-add-card'))==3,'Hinzufügen-Karten fehlen')
              click('.tabs > .tab[data-view="calendar"]'); assertx(active('calendar'),'Aufgaben öffnet nicht')
              click('.tabs > .tab[data-view="more"]'); assertx(active('more'),'Mehr öffnet nicht')
              print('PASS Hinzufügen / Aufgaben / Mehr')

              severe=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon' not in x.get('message','').lower()]
              if severe:
                  print('Browser SEVERE:',json.dumps(severe,ensure_ascii=False))
                  raise AssertionError('Schwere Browserfehler gefunden')
              print('LIVE MOBILE AUDIT: PASS')
          finally:
              d.quit()
          PY
          python /tmp/live_audit.py
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/jgw-live-mobile-audit.yml
          git commit -m 'Remove completed live mobile audit workflow'
          git push
