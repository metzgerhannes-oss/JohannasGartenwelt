name: Patch Habitat Illustrations

on:
  push:
    paths:
      - '.github/workflows/patch-habitat-illustrations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lebensraum-Karten illustrieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

