name: Patch Habitat Illustrations

on:
  push:
    paths:
      - '.github/workflows/patch-habitat-illustrations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lebensraum-Karten illustrieren
        run: python .github/scripts/patch-habitat-illustrations.py
      - name: Hinweistext aktualisieren
        run: python .github/scripts/patch-habitat-wording.py
      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          checked=0
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              f=Path('/tmp')/f'inline-{i}.js'
              f.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
              checked+=1
          assert 'function habitatIllustration(type){' in s
          assert 'visual=habitatIllustration(h.type)' in s
          assert "habitatIllustration(h.type),supports=" in s
          assert 'Eigene Fotos bleiben in der Detailansicht erhalten.' in s
          print('Inline-Skripte geprüft:',checked)
          PY
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lebensraum-Darstellung abrunden"
          git push
