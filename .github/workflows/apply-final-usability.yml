name: Apply final usability refinements

on:
  push:
    paths:
      - '.github/workflows/apply-final-usability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final usability details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          old='<div class="setup-guide-head"><div><h2>In drei Schritten startklar</h2><div class="muted">Nur beim ersten Einrichten. Bereits erledigte Schritte verschwinden automatisch.</div></div><button class="btn ghost small" id="setupDismiss" type="button">Ausblenden</button></div>'
          new='<div class="setup-guide-head"><div><h2 id="setupGuideTitle">In drei Schritten startklar</h2><div class="muted" id="setupGuideText">Nur beim ersten Einrichten. Erledigte Schritte werden automatisch ausgeblendet.</div></div><button class="btn ghost small" id="setupDismiss" type="button">Ausblenden</button></div>'
          assert old in s, 'Onboarding-Header nicht gefunden'
          s=s.replace(old,new,1)
          new_func='function renderOnboardingGuide(){var g=el("setupGuide");if(!g)return;var waitingForCloud=syncState.enabled&&syncConfigured()&&!state.plz&&!state.plants.length,locDone=!!state.plz,mapDone=!!(state.settings&&state.settings.mapView),plantDone=state.plants.length>0,complete=locDone&&mapDone&&plantDone,hidden=!!state.settings.onboardingDismissed||complete||waitingForCloud;show("setupGuide",!hidden);if(hidden)return;var steps=[["setupStepLocation","setupLocationState",locDone],["setupStepMap","setupMapState",mapDone],["setupStepPlant","setupPlantState",plantDone]],remaining=steps.filter(function(x){return !x[2]}).length;steps.forEach(function(x){var box=el(x[0]),st=el(x[1]);if(box){box.classList.toggle("done",x[2]);box.classList.toggle("hidden",x[2])}if(st)st.textContent=x[2]?"erledigt":"offen"});var title=el("setupGuideTitle"),text=el("setupGuideText");if(title)title.textContent=remaining===1?"Noch ein Schritt":"Noch "+remaining+" Schritte";if(text)text.textContent=remaining===1?"Fast geschafft – danach ist die Gartenwelt startklar.":"Nur beim ersten Einrichten. Erledigte Schritte werden automatisch ausgeblendet.";var mb=el("setupMapBtn");if(mb)mb.disabled=!locDone}'
          s,n=re.subn(r'function renderOnboardingGuide\(\)\{.*?\}\nfunction renderAll',new_func+'\nfunction renderAll',s,count=1,flags=re.S)
          assert n==1, 'renderOnboardingGuide nicht eindeutig ersetzt'
          old='el("syncGardenId").value=syncState.gardenId||"";'
          new='el("syncGardenId").value=(syncState.gardenId||"").toUpperCase();'
          assert old in s, 'Garden-ID Anzeige nicht gefunden'
          s=s.replace(old,new,1)
          foot='<div class="foot">Gießempfehlungen sind Modellschätzungen aus Regen, ET₀, Pflanzart, Wasserbedarf, Pflanzengröße, Anwachsphase und markierten Standortzonen. Bodenfeuchte vor dem Gießen prüfen. Luftbild: LGL Baden-Württemberg DOP20 Open Data. Wetter: Open-Meteo. Pflanzenerkennung optional: Pl@ntNet.</div>'
          assert foot in s, 'Technischer Fußtext nicht gefunden'
          s=s.replace(foot,'',1)
          anchor='    <details class="settings-section settings-danger">\n'
          info='    <details class="settings-section" id="settingsInfo">\n      <summary>Info & Datenquellen</summary>\n      <div class="muted" style="margin-top:8px">Gießempfehlungen sind Modellschätzungen aus Regen, ET₀, Pflanzart, Wasserbedarf, Pflanzengröße, Anwachsphase und markierten Standortzonen. Bodenfeuchte vor dem Gießen prüfen.</div>\n      <div class="muted" style="margin-top:8px"><b>Datenquellen:</b> Luftbild LGL Baden-Württemberg DOP20 Open Data · Wetter Open-Meteo · Pflanzenerkennung optional Pl@ntNet.</div>\n    </details>\n\n'
          assert anchor in s, 'Einfügepunkt für Info nicht gefunden'
          s=s.replace(anchor,info+anchor,1)
          nav={
          '<span class="navicon" aria-hidden="true">⌂</span>':'<span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg></span>',
          '<span class="navicon" aria-hidden="true">🌿</span>':'<span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20V9"/><path d="M12 12C7.7 12 5 9.5 5 5.5c4.3 0 7 2.5 7 6.5Z"/><path d="M12 15c4.3 0 7-2.5 7-6.5-4.3 0-7 2.5-7 6.5Z"/></svg></span>',
          '<span class="navicon" aria-hidden="true">⌖</span>':'<span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></span>',
          '<span class="navicon" aria-hidden="true">▦</span>':'<span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 9.5h16M8 13h2M14 13h2M8 16h2M14 16h2"/></svg></span>',
          '<span class="navicon" aria-hidden="true">☁</span>':'<span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.3 18h10.2a3.5 3.5 0 0 0 .4-7 5.7 5.7 0 0 0-10.8-1.7A4.4 4.4 0 0 0 7.3 18Z"/></svg></span>'
          }
          for old,new in nav.items():
              assert old in s, 'Navigationssymbol fehlt: '+old
              s=s.replace(old,new,1)
          css='.navicon{display:grid;place-items:center;width:20px;height:20px}\n.navicon svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}\n'
          marker='/* /JGW FINAL DESIGN */'
          assert marker in s, 'CSS Marker fehlt'
          s=s.replace(marker,css+marker,1)
          assert s!=original
          assert s.count('<svg viewBox="0 0 24 24">')>=5
          assert 'class="foot">Gießempfehlungen' not in s
          assert 'id="settingsInfo"' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and final markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          assert 'Noch ein Schritt' in s
          assert 'Info & Datenquellen' in s
          assert s.count('<svg viewBox="0 0 24 24">') >= 5
          PY
          node --check /tmp/index.js
      - name: Commit usability refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Polish final app usability"
          git push origin main
