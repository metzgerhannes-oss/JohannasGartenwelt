name: Mobile usability fix

"on":
  push:
    paths:
      - '.github/workflows/mobile-usability-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile usability fixes
        run: python tools/mobile_usability_fix.py
      - name: Validate JavaScript and CSS markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in ['JGW MOBILE USABILITY','Math.max(px,88)','jgw-keyboard-open','details:not(.plant-more)>summary','leaflet-control-zoom a']:
              assert marker in s, marker
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Mobile browser usability tests
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);time.sleep(1)
          opt=Options();opt.add_argument('--headless=new');opt.add_argument('--no-sandbox');opt.add_argument('--disable-dev-shm-usage')
          d=webdriver.Chrome(options=opt)
          def click(css):
              e=d.find_element(By.CSS_SELECTOR,css);d.execute_script('arguments[0].click()',e);time.sleep(.08);return e
          try:
              for w,h in [(320,740),(375,812),(390,844),(430,932)]:
                  d.set_window_size(w,h);d.get('http://127.0.0.1:8000/index.html');time.sleep(.25)
                  vw=d.execute_script('return document.documentElement.clientWidth')
                  # Main navigation: all five areas are touchable and no label is clipped.
                  for view in ['today','plants','map','calendar','weather']:
                      e=click(f'.tab[data-view="{view}"]')
                      assert e.rect['height']>=44,(w,view,e.rect)
                      assert d.execute_script('return arguments[0].scrollWidth<=arguments[0].clientWidth+2',e),(w,view)
                  # Header controls must remain inside the viewport.
                  gear=d.find_element(By.ID,'settingsGear')
                  gr=d.execute_script('return arguments[0].getBoundingClientRect()',gear)
                  assert gr['right']<=vw+1,(w,vw,gr)
                  # Nature tabs and common filters have touch-size targets.
                  click('.tab[data-view="plants"]')
                  for e in d.find_elements(By.CSS_SELECTOR,'.nature-tab'):
                      assert e.rect['height']>=40,(w,'nature-tab',e.rect)
                  click('.nature-tab[data-nature="plants"]')
                  for e in d.find_elements(By.CSS_SELECTOR,'.view-toggle button,.plant-filter'):
                      if e.is_displayed(): assert e.rect['height']>=40,(w,'plant control',e.get_attribute('class'),e.rect)
                  click('.nature-tab[data-nature="habitats"]')
                  for e in d.find_elements(By.CSS_SELECTOR,'.library-filter'):
                      if e.is_displayed(): assert e.rect['height']>=40,(w,'habitat filter',e.rect)
                  # Editors: primary actions remain full-width and usable on narrow screens.
                  click('#newHabitatBtn')
                  for e in d.find_elements(By.CSS_SELECTOR,'#habitatForm>.actions .btn'):
                      assert e.rect['height']>=44,(w,'habitat action',e.rect)
                  click('#closeHabitatEditor')
                  click('.nature-tab[data-nature="animals"]');click('#newAnimalBtn')
                  for e in d.find_elements(By.CSS_SELECTOR,'#animalForm>.actions .btn'):
                      assert e.rect['height']>=44,(w,'animal action',e.rect)
                  click('#closeAnimalEditor')
                  # Settings disclosure rows are finger-sized.
                  click('#settingsGear')
                  for e in d.find_elements(By.CSS_SELECTOR,'.settings-sheet details>summary'):
                      if e.is_displayed(): assert e.rect['height']>=40,(w,'settings summary',e.text,e.rect)
                  click('.settings-close')
                  assert d.execute_script('return document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'),(w,'page overflow')
              # iOS browser-mode fallback: toolbar height is often not exposed by visualViewport.
              d.execute_cdp_cmd('Network.setUserAgentOverride',{'userAgent':'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'})
              d.set_window_size(390,844);d.get('http://127.0.0.1:8000/index.html');time.sleep(.25)
              inset=d.execute_script("return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--jgw-browser-bottom'))||0")
              assert inset>=88,inset
              tabs=d.find_element(By.CSS_SELECTOR,'.tabs');r=d.execute_script('return arguments[0].getBoundingClientRect()',tabs)
              assert r['bottom']<=d.execute_script('return window.innerHeight')-87,(inset,r)
              click('.tab[data-view="plants"]')
              print('Mobile usability tests OK; iOS fallback inset',inset)
          finally:
              d.quit();server.terminate();server.wait(timeout=5)
          PY
      - name: Commit and remove temporary audit files
        shell: bash
        run: |
          rm -f tools/mobile_usability_fix.py tools/mobile_usability_audit.py .github/workflows/mobile-usability-fix.yml .github/workflows/mobile-usability-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve mobile usability across Gartenwelt"
          git push origin main
