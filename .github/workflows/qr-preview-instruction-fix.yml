name: QR preview guidance fix

"on":
  push:
    paths:
      - '.github/workflows/qr-preview-instruction-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch setup instructions
        run: python tools/qr_preview_instruction_fix.py
      - name: Validate markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('setup.html').read_text(encoding='utf-8')
          assert 'Kompass-Symbol' in s
          assert 'QR-/In-App-Vorschau' in s
          assert 'Safari verlassen' in s
          PY
          git diff --check
      - name: Commit and clean temporary files
        run: |
          rm -f tools/qr_preview_instruction_fix.py .github/workflows/qr-preview-instruction-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify iPhone QR preview before web app install"
          git push origin main
