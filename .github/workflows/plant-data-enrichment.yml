name: Automatic plant data enrichment

"on":
  push:
    paths:
      - '.github/workflows/plant-data-enrichment.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply plant data enrichment
        run: python tools/plant_data_enrichment.py
      - name: Validate syntax and structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for marker in [
            'async function enrichPlantForm',
            'observations/histogram',
            'api.gbif.org/v1/species/match',
            'trefle.io/api/v1/species/search',
            'id="plantDataStatus"',
            'id="refreshPlantDataBtn"',
            'id="trefleKey"',
            'careMeta:state.plantDataMeta',
            'buddleja davidii',
            'parrotia persica'
          ]:
              assert marker in s, marker
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Check free external sources
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          for sci in ['Buddleja davidii','Parrotia persica']:
              u='https://api.inaturalist.org/v1/taxa/autocomplete?'+urllib.parse.urlencode({'q':sci,'taxon_id':47126,'locale':'de','per_page':5})
              req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'JohannasGartenwelt/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
              exact=next((x for x in d.get('results',[]) if x.get('name','').lower()==sci.lower()),None)
              assert exact, (sci,d.get('results',[]))
              print('iNaturalist',sci,'taxon',exact.get('id'))
              h='https://api.inaturalist.org/v1/observations/histogram?'+urllib.parse.urlencode({'interval':'month_of_year','term_id':12,'term_value_id':13,'quality_grade':'research','taxon_id':exact['id'],'nelat':55.1,'nelng':15.1,'swlat':47.2,'swlng':5.8})
              with urllib.request.urlopen(urllib.request.Request(h,headers={'User-Agent':'JohannasGartenwelt/1.0'}),timeout=20) as r: hd=json.load(r)
              print('phenology',sci,hd.get('results',{}).get('month_of_year',{}))
              g='https://api.gbif.org/v1/species/match?'+urllib.parse.urlencode({'kingdom':'Plantae','name':sci})
              with urllib.request.urlopen(urllib.request.Request(g,headers={'User-Agent':'JohannasGartenwelt/1.0'}),timeout=20) as r: gd=json.load(r)
              assert gd.get('usageKey') or gd.get('speciesKey') or gd.get('key'), gd
              print('GBIF',sci,gd.get('scientificName') or gd.get('canonicalName'),gd.get('usageKey') or gd.get('speciesKey'))
          PY
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Mobile enrichment smoke test
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options();opt.add_argument('--headless=new');opt.add_argument('--no-sandbox');opt.add_argument('--disable-dev-shm-usage');opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt);d.set_window_size(390,844)
          wait=WebDriverWait(d,15)

          def open_new_plant():
              d.get('http://127.0.0.1:8000/index.html')
              wait.until(lambda x: x.find_elements(By.CSS_SELECTOR,'.tab[data-view="plants"]'))
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click();document.getElementById('newPlantBtn').click()")
              wait.until(EC.visibility_of_element_located((By.ID,'plantName')))

          def select_species(query, scientific):
              field=d.find_element(By.ID,'plantName')
              field.clear();field.send_keys(query)
              wait.until(lambda x: scientific in x.find_element(By.ID,'plantNameResults').text)
              rows=d.find_elements(By.CSS_SELECTOR,'#plantNameResults .plant-name-result')
              target=next((r for r in rows if scientific in r.text),None)
              assert target is not None,[r.text for r in rows]
              d.execute_script('arguments[0].click()',target)
              # Local profile data are filled immediately; the external enrichment may continue afterwards.
              wait.until(lambda x: x.find_element(By.ID,'plantScientific').get_attribute('value').lower()==scientific.lower())
              time.sleep(.6)

          def months(name):
              return [int(x.get_attribute('value')) for x in d.find_elements(By.CSS_SELECTOR,f'input[name="{name}"]:checked')]

          try:
              open_new_plant()
              select_species('Schmetterlingsflieder','Buddleja davidii')
              vals={
                  'water':d.find_element(By.ID,'plantWater').get_attribute('value'),
                  'fert':months('fert'),'cut':months('cut'),'bloom':months('bloom'),
                  'native':d.find_element(By.ID,'plantNative').get_attribute('value'),
                  'flower':d.find_element(By.ID,'plantFlowerAccess').get_attribute('value'),
                  'status':d.find_element(By.ID,'plantDataStatus').text,
              }
              print('Buddleja',vals)
              assert vals['water']=='normal'
              assert vals['fert']==[3,4,5]
              assert vals['cut']==[2,3]
              assert vals['bloom']==[7,8,9,10]
              assert vals['native']=='no'
              assert vals['flower']=='open'

              open_new_plant()
              select_species('Eisenholzbaum','Parrotia persica')
              vals2={
                  'water':d.find_element(By.ID,'plantWater').get_attribute('value'),
                  'fert':months('fert'),'cut':months('cut'),
                  'native':d.find_element(By.ID,'plantNative').get_attribute('value'),
                  'status':d.find_element(By.ID,'plantDataStatus').text,
              }
              print('Parrotia',vals2)
              assert vals2['water']=='normal'
              assert vals2['fert']==[3,4]
              assert vals2['cut']==[2,3]
              assert vals2['native']=='no'
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              print('mobile enrichment smoke test OK')
          finally:
              d.quit();server.terminate();server.wait(timeout=5)
          PY
      - name: Commit and clean temporary files
        shell: bash
        run: |
          rm -f tools/plant_data_enrichment.py .github/workflows/plant-data-enrichment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatically enrich recognized plant data"
          git push origin main
