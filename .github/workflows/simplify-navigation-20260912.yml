name: Simplify garden navigation

on:
  push:
    paths:
      - '.github/workflows/simplify-navigation-20260912.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply simplified navigation
        run: python tools/simplify_navigation_20260912.py
      - name: Static syntax and navigation audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          nav=re.search(r'<nav class="tabs" aria-label="Hauptnavigation">(.*?)</nav>',s,re.S)
          assert nav
          assert nav.group(1).count('class="tab') == 4
          for label in ('Garten','Pflanzen','Aufgaben','Mehr'):
              assert f'<span>{label}</span>' in nav.group(1)
          assert 'data-view="map"' not in nav.group(1)
          assert 'data-view="weather"' not in nav.group(1)
          assert s.count('id="taskCount"') == 1
          assert s.count('id="tasks"') == 1
          assert 'id="view-more"' in s
          assert '+ Pflanze hinzufügen' in s
          assert 'function savePlant(placeAfter)' in s
          assert 'openPlantDetail(p.id);notice(wasExisting?' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('simplified navigation audit OK')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Commit upgraded app and remove temporary files
        shell: bash
        run: |
          rm -f tools/simplify_navigation_20260912.py .github/workflows/simplify-navigation-20260912.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify app navigation and plant workflow"
          git push origin main
