name: Bump PWA build

on:
  push:
    paths:
      - '.github/workflows/bump-pwa-build.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-Buster und mobile Karten finalisieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'jgw-library-nav\.js\?v=[^"\']+', 'jgw-library-nav.js?v=20260914-5', s)
          if not n:
              raise SystemExit('jgw-library-nav include not found')
          p.write_text(s,encoding='utf-8')
          assert 'jgw-library-nav.js?v=20260914-5' in s
          assert 'collection-card-name-mobile plantOpen' in s
          print('index cache buster OK')
          PY
      - name: JavaScript prüfen
        run: node --check jgw-library-nav.js
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "PWA-Build 20260914-5 aktivieren"
          git push
