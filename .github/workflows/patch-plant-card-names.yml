name: Patch Plant Card Names

on:
  push:
    paths:
      - '.github/workflows/patch-plant-card-names.yml'
      - '.github/scripts/patch-plant-card-names.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kartenansicht anpassen
        run: python .github/scripts/patch-plant-card-names.py
      - name: JavaScript prüfen
        shell: bash
        run: |
          node --check jgw-ux-shell.js
          node --check jgw-library-nav.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip():
                  continue
              f=Path('/tmp')/f'inline-{i}.js'
              f.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'JGW MOBILE PLANT CARD NAME PRIORITY' in Path('jgw-ux-shell.js').read_text(encoding='utf-8')
          assert 'jgw-library-nav.js?v=20260914-3' in s
          PY
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html jgw-library-nav.js jgw-ux-shell.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jgw-library-nav.js jgw-ux-shell.js
          git commit -m "Pflanzennamen in mobiler Übersicht lesbar machen"
          git push
