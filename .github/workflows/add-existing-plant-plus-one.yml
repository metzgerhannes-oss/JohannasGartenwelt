name: Add +1 plant placement

on:
  push:
    paths:
      - '.github/workflows/add-existing-plant-plus-one.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply +1 plant placement
        run: python tools/add_existing_plant_plus_one.py
      - name: Static syntax and feature audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'plant-add-one',
            'plant-add-one-list',
            'placePlantAddId',
            'function beginAddPlantInstance',
            'Eine weitere Pflanze dieser Art hinzufügen',
            'detailAddOne',
            'Weitere Pflanze hinzugefügt',
            'state.placePlantId||state.placePlantAddId',
            'ap.quantity=aq+1'
          ]
          for x in required:
              assert x in s, x
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('static +1 plant placement audit OK')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Commit upgraded app and remove temporary files
        shell: bash
        run: |
          rm -f tools/add_existing_plant_plus_one.py .github/workflows/add-existing-plant-plus-one.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add +1 placement for existing plant cards"
          git push origin main
