name: Fix iOS 26 setup instructions

"on":
  push:
    paths:
      - '.github/workflows/fix-ios26-setup-copy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch setup instructions
        run: python tools/fix_ios26_setup_copy.py
      - name: Validate
        run: |
          grep -q '&lt; Kamera' setup.html
          grep -q 'Zu Home-Bildschirm hinzufügen' setup.html
          ! grep -q 'Kompass-Symbol' setup.html
          git diff --check
      - name: Commit and clean
        run: |
          rm -f tools/fix_ios26_setup_copy.py .github/workflows/fix-ios26-setup-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct iOS 26 Home Screen setup instructions"
          git push origin main
