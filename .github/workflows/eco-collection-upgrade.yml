name: Eco collection upgrade

"on":
  push:
    paths:
      - '.github/workflows/eco-collection-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply collection and ecology upgrade
        run: python tools/eco_collection_upgrade.py
      - name: Validate JavaScript and markup markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          for marker in ['id="ecoGardenScore"','id="plantDetailOverlay"','id="settingsEcology"','function gardenEcoScore','function renderPlantDetail','function renderEcoDashboard']:
              assert marker in s, marker
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Mobile browser smoke test
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          server=subprocess.Popen(['python','-m','http.server','8000','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=opt); d.set_window_size(390,844)
          demo={
            'plz':'72144','loc':{'lat':48.53,'lon':9.14,'name':'Demo','state':'Baden-Württemberg'},'gardenCenter':{'lat':48.53,'lon':9.14},
            'plants':[
              {'id':'p1','name':'Lavendel','scientific':'Lavandula angustifolia','family':'Lamiaceae','area':'Südbeet','type':'bed','water':'low','size':'medium','favorite':True,'photo':'','bloomMonths':[],'ecoNative':'auto','ecoFlowerAccess':'open','fertMonths':[3,4],'cutMonths':[3,7],'created':'2026-09-01'},
              {'id':'p2','name':'Wilder Dost','scientific':'Origanum vulgare','family':'Lamiaceae','area':'Wildbeet','type':'bed','water':'low','size':'medium','favorite':False,'photo':'','bloomMonths':[],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-09-02'},
              {'id':'p3','name':'Efeu','scientific':'Hedera helix','family':'Araliaceae','area':'Zaun','type':'bed','water':'normal','size':'large','favorite':False,'photo':'','bloomMonths':[],'ecoNative':'yes','ecoFlowerAccess':'open','fertMonths':[],'cutMonths':[],'created':'2026-09-03'}
            ],
            'zones':[],
            'ecology':{'habitat':{'waterSource':True,'deadwood':True,'bareSoil':False,'wildCorner':True,'noPesticides':True,'nativePlantsFocus':True}},
            'settings':{'plantnetKey':'','seasonMode':'auto','animations':False,'mapView':{'lat':48.53,'lon':9.14,'zoom':19},'onboardingDismissed':True,'plantView':'collection','plantSort':'name'},'days':30
          }
          try:
              d.get('http://127.0.0.1:8000/index.html')
              d.execute_script("localStorage.setItem('giess_check_garten_v3', arguments[0])",json.dumps(demo)); d.refresh(); time.sleep(1)
              score=d.find_element(By.ID,'ecoGardenScore').text
              assert '/ 100' in score and any(ch.isdigit() for ch in score), score
              d.execute_script("document.querySelector('.tab[data-view=\"plants\"]').click()")
              WebDriverWait(d,3).until(EC.presence_of_all_elements_located((By.CSS_SELECTOR,'.collection-card')))
              assert len(d.find_elements(By.CSS_SELECTOR,'.collection-card')) >= 3
              d.execute_script("document.querySelector('#plantList .plantOpen').click()")
              WebDriverWait(d,3).until(EC.visibility_of_element_located((By.ID,'plantDetailOverlay')))
              assert 'Insektenwert' in d.find_element(By.ID,'plantDetailContent').text
              d.execute_script("document.getElementById('plantDetailClose').click()")
              d.execute_script("document.getElementById('plantViewList').click()")
              time.sleep(.2)
              assert len(d.find_elements(By.CSS_SELECTOR,'.plant-list-row'))==3
              d.execute_script("document.getElementById('newPlantBtn').click()")
              time.sleep(.2)
              name=d.find_element(By.ID,'plantName'); name.send_keys('Lavendel'); time.sleep(.2)
              preview=d.execute_script("return document.getElementById('plantEcoPreview').textContent")
              assert 'Insektenwert' in preview, preview
              d.execute_script("document.getElementById('settingsGear').click()")
              time.sleep(.2)
              assert d.find_element(By.ID,'settingsEcology').is_displayed()
              assert d.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
              print('eco collection browser test OK')
          finally:
              d.quit(); server.terminate(); server.wait(timeout=5)
          PY
      - name: Commit upgraded app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add plant card collection and insect-friendly garden score"
          git push origin main
