name: Diagnose visible plant source
on:
  push:
    paths:
      - '.github/workflows/diag-visible-plant-source.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show plant card sources
        run: |
          echo '=== SCRIPT REFS IN INDEX ==='
          grep -oE '<script[^>]+src="[^"]+"' index.html || true
          echo '=== PLANT CARD SYMBOLS ==='
          grep -RInE 'plantCardHtml|collection-card|plant-add-one|collection-name|plantOpen' --include='*.js' --include='*.html' . | head -n 800 || true
          echo '=== SPECIAL PLANT CARD FILE REFS ==='
          grep -RInE 'jgw-plant-cards-v[23]|jgw-ui-cleanup|jgw-ux-shell' --include='*.js' --include='*.html' . || true
          echo '=== MOBILE COLLECTION CSS FROM INDEX ==='
          grep -nE 'collection-card|collection-photo|collection-name|collection-body' index.html | head -n 250 || true
