name: Bump gallery version v10
on:
  push:
    paths:
      - '.github/workflows/bump-gallery-version-v10.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./jgw-library-nav.js?v=20260914-9'
          new='./jgw-library-nav.js?v=20260914-10'
          if old not in s:
              raise SystemExit('expected loader v9 not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Galerie-Version 2026.09.14-03 aktivieren'
          git push
