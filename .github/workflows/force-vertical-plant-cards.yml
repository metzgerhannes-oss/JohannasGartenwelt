name: Force vertical plant cards
on:
  push:
    paths:
      - '.github/workflows/force-vertical-plant-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Replace plant card markup at source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_func=r'''function plantCardHtml(p,feature){var wa=waterAssessment(p),z=currentZoneForPlant(p),e=plantInsectValue(p),photo=plantPhotoMarkup(p,p.name,true)||'<div class="collection-no-photo">🌿<small>Foto ergänzen</small></div>',area=p.area?esc(p.area):(z?esc(lightLabel(z.light)):"Standort noch nicht benannt"),chips=[];if(p.type&&p.type!=="bed")chips.push(typeLabel(p.type));if(establishmentInfo(p).days<=90)chips.push("Anwachsphase");if(e.bloomMonths.includes(new Date().getMonth()+1))chips.push("blüht jetzt");return'<article class="collection-card'+(feature?' feature':'')+'" style="display:block!important;grid-template-columns:none!important;grid-template-rows:none!important;flex-direction:column!important;align-items:stretch!important;overflow:hidden!important"><div class="collection-photo" style="display:block!important;width:100%!important;height:auto!important;aspect-ratio:16/10!important;position:relative!important;overflow:hidden!important"><button class="collection-card-main plantOpen" style="display:block!important;width:100%!important;height:100%!important;min-width:0!important" data-id="'+p.id+'" type="button" aria-label="'+esc(p.name)+' öffnen">'+photo+'</button><button class="favorite-plant '+(p.favorite?'on':'')+'" data-id="'+p.id+'" type="button" aria-label="'+(p.favorite?'Favorit entfernen':'Als Favorit markieren')+'">'+(p.favorite?'★':'☆')+'</button><span class="insect-badge '+ecoBadgeClass(e.score)+'">🐝 '+e.score+'</span>'+(Number(p.quantity||1)>1?'<span class="plant-quantity-badge">×'+Number(p.quantity||1)+'</span>':'')+'<button class="plant-add-one" data-id="'+p.id+'" type="button" aria-label="Eine weitere Pflanze dieser Art hinzufügen">+1</button></div><button class="collection-card-main plantOpen" style="display:block!important;width:100%!important;min-width:0!important;text-align:left!important" data-id="'+p.id+'" type="button"><div class="collection-body" style="display:block!important;width:100%!important;min-width:0!important;padding:8px 9px 10px!important"><div class="collection-name" style="display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:2!important;white-space:normal!important;overflow:hidden!important;text-overflow:clip!important;overflow-wrap:anywhere!important;line-height:1.15!important;min-height:2.3em!important;max-height:none!important;padding:0!important;margin:0!important">'+esc(p.name)+'</div><div class="collection-latin">'+esc(p.scientific||'')+'</div><div class="collection-area">'+area+'</div><div class="collection-status"><span class="statusdot '+wa.level+'"></span>'+esc(wa.title)+'</div>'+(chips.length?'<div class="collection-chips">'+chips.map(function(c){return'<span class="collection-chip">'+esc(c)+'</span>'}).join('')+'</div>':'')+'</div></button></article>'}'''
          pat=r'function plantCardHtml\(p,feature\)\{.*?\}\nfunction plantListRowHtml'
          s2,n=re.subn(pat,new_func+'\nfunction plantListRowHtml',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('plantCardHtml not replaced')
          # force a fresh loader URL as well
          s2,n2=re.subn(r'jgw-library-nav\.js\?v=[^"\']+', 'jgw-library-nav.js?v=20260914-16', s2, count=1)
          if n2!=1:
              raise SystemExit('loader version not replaced')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'jgw-library-nav.js?v=20260914-16' index.html
          grep -q 'style="display:block!important;grid-template-columns:none!important' index.html
          grep -q -- '-webkit-line-clamp:2!important' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'function plantCardHtml\(p,feature\)\{.*?\}\nfunction plantListRowHtml',s,re.S)
          assert m, 'function missing'
          assert 'collection-card-name-mobile' not in m.group(0), 'old duplicate footer still in plantCardHtml'
          print('plantCardHtml source patch OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Pflanzenkarten direkt im Markup vertikal erzwingen'
          git push
