name: CSP smoke test

on:
  push:
    branches:
      - csp-hardening-20260920
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jgw-http.log 2>&1 &
          echo $! > /tmp/jgw-http.pid
          sleep 2
      - name: Run CSP browser smoke test
        run: node scripts/csp-smoke.mjs
