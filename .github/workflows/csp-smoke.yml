name: CSP smoke test

permissions:
  contents: write

on:
  push:
    branches:
      - csp-hardening-20260920
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare stable main baseline
        run: |
          git fetch origin main --depth=1
          rm -rf /tmp/jgw-main
          git worktree add --detach /tmp/jgw-main FETCH_HEAD
      - name: Start local servers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jgw-branch-http.log 2>&1 &
          echo $! > /tmp/jgw-branch-http.pid
          (cd /tmp/jgw-main && python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/jgw-main-http.log 2>&1 & echo $! > /tmp/jgw-main-http.pid)
          sleep 2
      - name: Run stable main baseline
        id: baseline
        continue-on-error: true
        run: JGW_BASE=http://127.0.0.1:4174 node scripts/csp-smoke.mjs
      - name: Run CSP browser smoke test
        id: smoke
        continue-on-error: true
        run: JGW_BASE=http://127.0.0.1:4173 node scripts/csp-smoke.mjs
      - name: Commit smoke result to test branch
        if: always() && github.event_name == 'push'
        run: |
          if [ -f csp-smoke-result.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add csp-smoke-result.json
            git diff --cached --quiet || git commit -m "Test: CSP Browser-Smoke-Ergebnis [skip ci]"
            git push
          fi
      - name: Report A/B result
        if: always()
        run: |
          echo "stable-main=${{ steps.baseline.outcome }}"
          echo "csp-branch=${{ steps.smoke.outcome }}"
      - name: Fail when CSP smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
