name: CSP smoke test

permissions:
  contents: write

on:
  push:
    branches:
      - csp-hardening-20260920
  workflow_dispatch:

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jgw-http.log 2>&1 &
          echo $! > /tmp/jgw-http.pid
          sleep 2
      - name: Run CSP browser smoke test
        id: smoke
        continue-on-error: true
        run: node scripts/csp-smoke.mjs
      - name: Commit smoke result to test branch
        if: always() && github.event_name == 'push'
        run: |
          if [ -f csp-smoke-result.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add csp-smoke-result.json
            git diff --cached --quiet || git commit -m "Test: CSP Browser-Smoke-Ergebnis [skip ci]"
            git push
          fi
      - name: Fail when smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
