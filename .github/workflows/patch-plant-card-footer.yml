name: Patch Plant Card Full Name

on:
  push:
    paths:
      - '.github/workflows/patch-plant-card-footer.yml'
      - '.github/scripts/patch-plant-card-footer.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pflanzennamen als volle Kartenzeile ergänzen
        run: python .github/scripts/patch-plant-card-footer.py
      - name: Syntax und Patch prüfen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'JGW PLANT CARD FULL NAME FOOTER' in s
          assert 'collection-card-name-mobile plantOpen' in s
          assert 'jgw-library-nav.js?v=20260914-4' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              f=Path('/tmp')/f'index-{i}.js'
              f.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print('Patch und Inline-JavaScript OK')
          PY
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Pflanzennamen in Übersicht dauerhaft sichtbar machen"
          git push
