name: One-shot task cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-task-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update task helper cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './garten-tipps.js?v=20260917-4'
          new = './garten-tipps.js?v=20260917-5'
          if old not in s:
              raise SystemExit(f'Expected reference not found: {old}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-task-cache-bust.yml
      - name: Commit final task fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-task-cache-bust.yml
          git commit -m "Deploy robust garden task bulk actions"
          git push
