name: Activate plant card v2

on:
  push:
    paths:
      - '.github/workflows/quick-activate-plant-cards.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Neue UI-Version aktivieren
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='jgw-library-nav.js?v=20260914-4'
          new='jgw-library-nav.js?v=20260914-5'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Loader-Version nicht gefunden')
          assert new in p.read_text(encoding='utf-8')
          PY
          node --check jgw-library-nav.js
          node --check jgw-plant-cards-v2.js
          grep -q 'jgw-ux-shell.js","20260914-7' jgw-library-nav.js
          grep -q 'jgw-plant-cards-v2.js","20260914-1' jgw-library-nav.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Bereits aktiviert"
          else
            git commit -m "Lesbare mobile Pflanzenkarten aktivieren"
            git push
          fi
