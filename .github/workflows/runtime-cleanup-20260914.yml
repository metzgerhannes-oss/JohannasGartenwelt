name: One-time runtime cleanup

on:
  push:
    paths:
      - 'tools/apply_runtime_cleanup_20260914.py'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-time runtime cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python tools/apply_runtime_cleanup_20260914.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check jgw-ux-shell.js
          node --check jgw-ux-patch.js
          node --check jgw-photo-storage-v2.js
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'Johannas Gartenwelt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html jgw-ux-shell.js jgw-ux-patch.js jgw-photo-storage-v2.js
          git commit -m 'Apply runtime cleanup [skip ci]'
          git push
