name: Secure Trefle proxy client migration

on:
  push:
    paths:
      - '.github/workflows/secure-trefle-proxy-20260912.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply secure Trefle client patch
        run: python tools/secure_trefle_proxy_patch_20260912.py

      - name: Static security and syntax audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s=Path('index.html').read_text(encoding='utf-8')
          edge=Path('supabase/functions/trefle-enrich/index.ts').read_text(encoding='utf-8')
          cfg=Path('supabase/config.toml').read_text(encoding='utf-8')

          assert '/functions/v1/trefle-enrich' in s
          assert 'id="trefleKey"' not in s
          assert 'savePlantDataKey' not in s
          assert 'state.settings.trefleKey' not in s
          assert 'https://trefle.io/api/v1/species/search' not in s
          assert 'Deno.env.get("TREFLE_TOKEN")' in edge
          assert 'jgw_status_garden' in edge
          assert 'unauthorized_garden' in edge
          assert '[functions.trefle-enrich]' in cfg
          assert 'verify_jwt = false' in cfg

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('secure Trefle proxy static audit OK')
          PY
          node --check /tmp/index.js
          git diff --check

      - name: Commit migrated app and remove temporary patch files
        shell: bash
        run: |
          rm -f tools/secure_trefle_proxy_patch_20260912.py .github/workflows/secure-trefle-proxy-20260912.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route Trefle enrichment through secure Supabase proxy"
          git push origin main
