name: Fix photo storage binding

on:
  push:
    paths:
      - '.github/workflows/fix-photo-storage-binding.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix optimizer binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = r'''function installSettings(){var btn=document.getElementById("optimizePhotoStorageBtn");if(btn){if(!btn.dataset.storageBound){btn.dataset.storageBound="1";btn.addEventListener("click",optimize)}updateStatus();return}var exp=document.getElementById("exportBtn");if(!exp)return;var actions=exp.closest(".actions"),box=actions&&actions.parentElement;if(!box)return;var wrap=document.createElement("div");wrap.style.marginTop="10px";wrap.innerHTML='<button class="btn secondary small" id="optimizePhotoStorageBtn" type="button">Speicher optimieren</button><div class="muted" id="photoStorageStatus" style="margin-top:7px"></div>';box.appendChild(wrap);btn=document.getElementById("optimizePhotoStorageBtn");if(btn&&!btn.dataset.storageBound){btn.dataset.storageBound="1";btn.addEventListener("click",optimize)}updateStatus()}'''

          pattern = r'function installSettings\(\)\{.*?\}\nfunction updateStatus'
          for name in ['photo-storage.js','index.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              ns,n=re.subn(pattern,replacement+'\nfunction updateStatus',s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'installSettings not patched in {name}: {n}')
              p.write_text(ns,encoding='utf-8')
          PY
          node --check photo-storage.js
          git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html photo-storage.js
          git commit -m "Fix photo storage optimizer binding [skip ci]"
          git push
