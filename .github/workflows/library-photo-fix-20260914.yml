name: One-time library photo fix

on:
  push:
    paths:
      - 'tools/fix_library_photos_20260914.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time library photo fix'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_library_photos_20260914.py
      - name: Validate JavaScript
        run: |
          node --check jgw-library-v4.js
          node --check jgw-library-nav.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Johannas Gartenwelt CI'
          git config user.email 'actions@users.noreply.github.com'
          git add jgw-library-v4.js jgw-library-nav.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load reference photos in library [skip ci]'
          git push
