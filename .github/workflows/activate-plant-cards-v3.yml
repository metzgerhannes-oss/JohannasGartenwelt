name: Activate plant cards v3

on:
  push:
    paths:
      - '.github/workflows/activate-plant-cards-v3.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Loader-Version anheben
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='jgw-library-nav.js?v=20260914-5'
          new='jgw-library-nav.js?v=20260914-6'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Loader-Verweis nicht gefunden')
          PY
          node --check jgw-library-nav.js
          node --check jgw-plant-cards-v3.js
          grep -q 'jgw-plant-cards-v3.js' jgw-library-nav.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Bereits aktiv"
          else
            git commit -m "Pflanzenkarten v3 im App-Einstieg aktivieren"
            git push
          fi
