name: Vokabeltrainer legacy redirect check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vokabeltrainer-checks.yml'
      - 'vokabeltrainer/index.html'
      - 'vokabeltrainer/sw.js'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vokabeltrainer-checks.yml'
      - 'vokabeltrainer/index.html'
      - 'vokabeltrainer/sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify legacy app redirects to canonical Vokabeltrainer
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'url=/Vokabeltrainer/' vokabeltrainer/index.html
          grep -F "const TARGET='/Vokabeltrainer/';" vokabeltrainer/sw.js
          if grep -Fq 'v0.9.17' vokabeltrainer/index.html; then
            echo 'Legacy app must not render the retired release.'
            exit 1
          fi
