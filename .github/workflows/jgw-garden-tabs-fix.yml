name: One-time garden section navigation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jgw-garden-tabs-fix.yml'
      - '.github/jgw_patch_library_mode.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch library and garden navigation
        run: python3 .github/jgw_patch_library_mode.py
      - name: Validate JavaScript
        run: node --check jgw-library-nav.js
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/jgw-garden-tabs-fix.yml .github/jgw_patch_library_mode.py
          git add jgw-library-nav.js
          git commit -m 'Improve garden tabs and personal library mode'
          git push
