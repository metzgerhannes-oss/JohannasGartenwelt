name: UI Regression Audit

on:
  push:
    paths:
      - '.github/workflows/ui-regression-audit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax und statischer Button-Audit
        shell: bash
        run: |
          node --check garten-tipps.js
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          head=html.split('<script',1)[0]
          ids=re.findall(r'<button\b[^>]*\bid="([^"]+)"',head,re.I)
          dup=sorted({x for x in ids if ids.count(x)>1})
          print('Statische Button-IDs:',len(ids))
          print('Doppelte statische Button-IDs:',dup)
          if dup: sys.exit(1)
          for required in ['today','plants','calendar','more']:
              if f'data-view="{required}"' not in head:
                  raise SystemExit('Navigation fehlt: '+required)
          if '<script src="./garten-tipps.js"></script>' not in html:
              raise SystemExit('Garten-Tipps nicht eingebunden')
          PY
      - name: Playwright installieren
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Lokalen Server starten
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/jgw-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/jgw-http.log
          exit 1
      - name: Browser-Smoke-Test
        shell: bash
        run: |
          cat > /tmp/jgw-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE: '+m.text())});
          page.on('dialog',d=>d.accept());
          await page.addInitScript(()=>{
            const orig=EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener=function(type,fn,opt){
              try{if(type==='click'&&this instanceof Element)this.setAttribute('data-audit-click','1');if(type==='submit'&&this instanceof Element)this.setAttribute('data-audit-submit','1')}catch(e){}
              return orig.call(this,type,fn,opt);
            };
            localStorage.setItem('giess_check_garten_v3',JSON.stringify({
              plz:'',loc:null,gardenCenter:null,days:30,
              plants:[{id:'p1',name:'Lavendel',scientific:'Lavandula angustifolia',area:'Sonnenbeet',type:'bed',water:'low',size:'medium',quantity:2,bloomMonths:[6,7,8],ecoNative:'no',fertMonths:[4],cutMonths:[3,8],created:'2026-01-01'}],
              habitats:[{id:'h1',type:'deadwood',status:'present',area:'Sonnenbeet',notes:''}],
              animals:[],areas:[{id:'ar1',name:'Sonnenbeet'}],
              zones:[{id:'z1',name:'Sonnenbeet',light:'sunny',rain:'open',soil:'normal',points:[{lat:48.5,lon:9.0},{lat:48.5001,lon:9.0},{lat:48.5001,lon:9.0001}]}],
              ecology:{practice:{noPesticides:true,leaveStemsInWinter:false,leavesPartlyRemain:false,peatFree:true,lessFrequentMowing:false,reducedNightLight:false}},
              settings:{seasonMode:'auto',animations:false,mapView:null,onboardingDismissed:true,plantView:'collection',plantSort:'name',natureTab:'plants',plantnetKey:''}
            }));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(700);
          const assert=(cond,msg)=>{if(!cond)throw new Error(msg)};
          async function nav(view){
            await page.evaluate(()=>window.scrollTo(0,900));
            await page.waitForTimeout(50);
            await page.locator(`.tab[data-view="${view}"]`).evaluate(el=>el.click());
            await page.waitForTimeout(250);
            assert(await page.locator(`#view-${view}`).evaluate(el=>el.classList.contains('active')),`View ${view} nicht aktiv`);
            const y=await page.evaluate(()=>window.scrollY);
            console.log('NAV_SCROLL',view,y);
            return y;
          }
          const scroll={}; for(const v of ['today','plants','calendar','more']) scroll[v]=await nav(v);
          await page.locator('.tab[data-view="more"]').evaluate(el=>el.click()); await page.waitForTimeout(100);
          for(const [id,target] of [['moreMapBtn','view-map'],['moreWeatherBtn','view-weather']]){
            await page.locator('#'+id).click(); await page.waitForTimeout(250);
            assert(await page.locator('#'+target).evaluate(el=>el.classList.contains('active')),id+' öffnet Ziel nicht');
            await page.locator('.tab[data-view="more"]').evaluate(el=>el.click()); await page.waitForTimeout(100);
          }
          await page.locator('#moreSettingsBtn').click(); await page.waitForTimeout(150);
          assert(!(await page.locator('#settingsOverlay').evaluate(el=>el.classList.contains('hidden'))),'Einstellungen öffnen fehlgeschlagen');
          await page.locator('#settingsClose').click();
          await page.locator('#moreAdvisorBtn').click(); await page.waitForTimeout(200);
          assert(await page.locator('#view-advisor').evaluate(el=>el.classList.contains('active')),'Garten-Tipps öffnen fehlgeschlagen');
          for(const mode of ['balance','animals','native','easy']) await page.locator(`#jga-body [data-m="${mode}"]`).click();
          await page.locator('#jga-zone').selectOption('z1');
          await page.locator('#jga-focus').selectOption('p1');
          await page.locator('#jga-refresh').click();
          await page.locator('.tab[data-view="plants"]').evaluate(el=>el.click()); await page.waitForTimeout(120);
          for(const n of ['plants','habitats','animals']){const b=page.locator(`.nature-tab[data-nature="${n}"]`); if(await b.count()) {await b.click(); await page.waitForTimeout(80);}}
          const addPlant=page.locator('#newPlantBtn'); if(await addPlant.count()){await addPlant.click(); await page.waitForTimeout(100); await page.locator('#closePlantEditor').click();}
          await page.locator('.tab[data-view="calendar"]').evaluate(el=>el.click()); await page.waitForTimeout(100);
          const cal=page.locator('#calendarToggle'); if(await cal.count()) await cal.click();
          const qp=page.locator('#quickAddPlant'); if(await qp.count()){await qp.click(); await page.waitForTimeout(100); if(await page.locator('#closePlantEditor').count()) await page.locator('#closePlantEditor').click();}
          const gear=page.locator('#settingsGear'); if(await gear.count()){await gear.click(); await page.waitForTimeout(100); await page.locator('#settingsClose').click();}
          const audit=await page.locator('button').evaluateAll(btns=>btns.map((b,i)=>({i,id:b.id||'',text:(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,70),type:b.type,click:b.getAttribute('data-audit-click')==='1'||typeof b.onclick==='function',formSubmit:b.type==='submit'&&b.form&&(b.form.getAttribute('data-audit-submit')==='1')})));
          const unbound=audit.filter(x=>!x.click&&!x.formSubmit);
          console.log('BUTTON_TOTAL',audit.length);
          console.log('BUTTON_UNBOUND',JSON.stringify(unbound));
          console.log('JS_ERRORS',JSON.stringify(errors));
          console.log('SCROLL_RESULTS',JSON.stringify(scroll));
          if(errors.some(e=>!e.includes('favicon')&&!e.includes('ERR_')))throw new Error('JavaScript-Konsolenfehler: '+errors.join(' | '));
          await browser.close();
          JS
          node /tmp/jgw-audit.mjs | tee /tmp/jgw-audit.log
          grep -E 'NAV_SCROLL|BUTTON_TOTAL|BUTTON_UNBOUND|JS_ERRORS|SCROLL_RESULTS' /tmp/jgw-audit.log
