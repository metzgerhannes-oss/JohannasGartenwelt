name: Patch Navigation Scroll Top

on:
  push:
    paths:
      - '.github/workflows/patch-nav-scroll-top.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hauptnavigation auf Seitenanfang setzen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='if(name==="calendar")renderCalendar();if(name==="plants")renderPlants()}'
          new='if(name==="calendar")renderCalendar();if(name==="plants")renderPlants();window.scrollTo({top:0,left:0,behavior:"auto"})}'
          if old not in s:
              if new in s:
                  print('Bereits eingebaut')
              else:
                  raise SystemExit('switchView-Anker nicht gefunden')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Navigation springt beim Wechsel nach oben"
          git push
