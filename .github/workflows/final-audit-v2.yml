name: Final garden audit v2

on:
  push:
    paths:
      - '.github/workflows/final-audit-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          idx=Path('index.html').read_text(encoding='utf-8')
          setup=Path('setup.html').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for fn,s in [('index.html',idx),('setup.html',setup)]:
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              Path('/tmp/'+fn+'.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/setup.html.js
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Run targeted browser audit
        run: python tools/unresolved_audit.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: johannas-gartenwelt-unresolved-audit
          path: audit_unresolved
          if-no-files-found: warn
          retention-days: 14
