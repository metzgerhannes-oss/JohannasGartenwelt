name: One-time fix detail edit navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-edit-navigation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fix editors opened from Bibliothek
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'function openPlantEditor(id){resetPlantForm();show("plantEditor",true);':
              'function openPlantEditor(id){switchView("plants");setNatureTab("plants",false);resetPlantForm();show("plantEditor",true);',
              'function openHabitatEditor(id){resetHabitatForm();var h=':
              'function openHabitatEditor(id){switchView("plants");setNatureTab("habitats",false);resetHabitatForm();var h=',
              'function openAnimalEditor(id,preset){resetAnimalForm();var a=':
              'function openAnimalEditor(id,preset){switchView("plants");setNatureTab("animals",false);resetAnimalForm();var a=',
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:70]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify navigation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'function openPlantEditor(id){switchView("plants");setNatureTab("plants",false);',
              'function openHabitatEditor(id){switchView("plants");setNatureTab("habitats",false);',
              'function openAnimalEditor(id,preset){switchView("plants");setNatureTab("animals",false);',
          ]
          for c in checks:
              assert c in s, c
          print('PASS: editors always open in their visible Mein-Garten pane')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-detail-edit-navigation.yml
          git commit -m 'Fix detail edit navigation from library'
          git push
