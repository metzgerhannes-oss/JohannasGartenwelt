name: Patch Advice Images

on:
  push:
    paths:
      - '.github/workflows/patch-advice-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bilder in Gartenempfehlung ergänzen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('jgw-library-v4.js')
          s=p.read_text(encoding='utf-8')
          old_css='.jgw-today-advice{background:linear-gradient(135deg,#f7f5e9,#eef5e8);border:1px solid #dde5ce}.jgw-today-advice h3{margin:0 0 4px}.jgw-today-advice .jgw-advice-main{font-size:14px;line-height:1.45;color:#53614a}.jgw-today-advice .actions{margin-top:10px}'
          new_css='.jgw-today-advice{background:linear-gradient(135deg,#f7f5e9,#eef5e8);border:1px solid #dde5ce}.jgw-today-advice h3{margin:0 0 4px}.jgw-today-advice .jgw-advice-main{font-size:14px;line-height:1.45;color:#53614a}.jgw-today-advice .actions{margin-top:10px}.jgw-advice-layout{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:stretch}.jgw-advice-photo{position:relative;min-height:112px;border-radius:15px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#e7f0e2,#f5e8ea);border:1px solid #d8e2d0;font-size:42px;color:var(--forest-dark)}.jgw-advice-photo img{width:100%;height:100%;min-height:112px;object-fit:cover;display:block}.jgw-advice-source{position:absolute;right:5px;bottom:5px;border-radius:999px;padding:3px 6px;background:rgba(38,54,38,.74);color:#fff;font-size:8px;font-weight:800;line-height:1;backdrop-filter:blur(4px)}.jgw-advice-copy{min-width:0;display:flex;flex-direction:column;justify-content:center}.jgw-advice-copy .actions{margin-top:9px}@media(max-width:520px){.jgw-advice-layout{grid-template-columns:92px minmax(0,1fr);gap:11px}.jgw-advice-photo,.jgw-advice-photo img{min-height:98px}.jgw-advice-photo{font-size:36px}.jgw-today-advice h3{font-size:18px}.jgw-today-advice .jgw-advice-main{font-size:13px}}'
          if old_css not in s:
              if '.jgw-advice-layout{' not in s:
                  raise SystemExit('CSS-Anker nicht gefunden')
          else:
              s=s.replace(old_css,new_css,1)

          old_fn='function adviceCard(){var today=el("view-today");if(!today)return;var c=el("jgwTodayAdvice");if(!c){c=document.createElement("div");c.id="jgwTodayAdvice";c.className="box jgw-today-advice";today.insertBefore(c,el("ecoDashboardCompact")||null)}var a=advice();if(a){var extra=a.hit.length?\' · schließt Blühlücke \'+a.hit.map(month).join(", "):\'\';c.innerHTML=\'<h3>Was deinem Garten jetzt gut tun würde</h3><div class="jgw-advice-main"><b>\'+esc(a.p.name)+\'</b>\'+esc(extra)+\'<br><span class="muted">\'+esc(a.p.why)+\'</span></div><div class="actions"><button class="btn secondary small" id="jgwAdviceBtn">Vorschläge ansehen</button></div>\'}else c.innerHTML=\'<h3>Was passt noch?</h3><div class="jgw-advice-main">Dein Bestand ist bereits vielfältig. In der Bibliothek kannst du weitere Arten entdecken.</div><div class="actions"><button class="btn secondary small" id="jgwAdviceBtn">Bibliothek öffnen</button></div>\';el("jgwAdviceBtn").onclick=function(){kind="plants";own=false;filter="all";el("jgwLibrarySearch").value="";open()}}'
          new_fn='function adviceCard(){var today=el("view-today");if(!today)return;var c=el("jgwTodayAdvice");if(!c){c=document.createElement("div");c.id="jgwTodayAdvice";c.className="box jgw-today-advice";today.insertBefore(c,el("ecoDashboardCompact")||null)}var a=advice();if(a){var extra=a.hit.length?\' · schließt Blühlücke \'+a.hit.map(month).join(", "):\'\',key=norm(a.p.scientific||a.p.name);c.innerHTML=\'<div class="jgw-advice-layout"><div class="jgw-advice-photo" id="jgwAdvicePhoto" data-key="\'+esc(key)+\'">🌿</div><div class="jgw-advice-copy"><h3>Was deinem Garten jetzt gut tun würde</h3><div class="jgw-advice-main"><b>\'+esc(a.p.name)+\'</b>\'+esc(extra)+\'<br><span class="muted">\'+esc(a.p.why)+\'</span></div><div class="actions"><button class="btn secondary small" id="jgwAdviceBtn">Vorschläge ansehen</button></div></div></div>\';libraryPhoto(a.p,true).then(function(ph){var box=el("jgwAdvicePhoto");if(!box||box.dataset.key!==key||!ph||!ph.photo)return;box.innerHTML=\'<img loading="lazy" src="\'+esc(ph.photo)+\'" alt="\'+esc(a.p.name)+\'"><span class="jgw-advice-source" title="\'+esc(ph.attribution||"iNaturalist")+\'">iNaturalist</span>\'})}else c.innerHTML=\'<h3>Was passt noch?</h3><div class="jgw-advice-main">Dein Bestand ist bereits vielfältig. In der Bibliothek kannst du weitere Arten entdecken.</div><div class="actions"><button class="btn secondary small" id="jgwAdviceBtn">Bibliothek öffnen</button></div>\';el("jgwAdviceBtn").onclick=function(){kind="plants";own=false;filter="all";el("jgwLibrarySearch").value="";open()}}'
          if old_fn not in s:
              if 'id="jgwAdvicePhoto"' not in s:
                  raise SystemExit('adviceCard-Anker nicht gefunden')
          else:
              s=s.replace(old_fn,new_fn,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax prüfen
        run: node --check jgw-library-v4.js
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- jgw-library-v4.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jgw-library-v4.js
          git commit -m "Bilder in Gartenempfehlungen anzeigen"
          git push
