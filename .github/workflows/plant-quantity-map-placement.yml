name: Plant quantity and map placement upgrade
# corrected retry: quantity badge syntax

on:
  push:
    paths:
      - '.github/workflows/plant-quantity-map-placement.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upgrade
        run: python tools/plant_quantity_map_upgrade.py
      - name: Static syntax and feature audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="plantQuantity"',
            'plant-quantity-badge',
            'placePlantDraftPositions',
            'function plantPositions',
            'function placementActive',
            'Position 1 von ',
            'Vorhandene Pflanzen und Bereiche sind währenddessen ausgeblendet.',
            'id="cancelPlacementBtn"',
            'p.positions=state.placePlantDraftPositions.slice(0,q)',
            'if(placementActive()){el("zoneList").innerHTML="";return}'
          ]
          for x in required:
              assert x in s, x
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('static quantity/map audit OK')
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Commit upgraded app and remove temporary files
        shell: bash
        run: |
          rm -f tools/plant_quantity_map_upgrade.py .github/workflows/plant-quantity-map-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add plant quantities and focused map placement"
          git push origin main
