name: Weather v2 patch
on:
  push:
    paths:
      - '.github/workflows/weather-v2-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch weather logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''async function getWeather(lat,lon){var vars="precipitation_sum,et0_fao_evapotranspiration,temperature_2m_min,temperature_2m_max";return requestJSON("https://api.open-meteo.com/v1/forecast?latitude="+encodeURIComponent(lat)+"&longitude="+encodeURIComponent(lon)+"&daily="+vars+"&timezone=Europe%2FBerlin&past_days=92&forecast_days=8",18000)}\nfunction weatherRows(){if(!state.weather||!state.weather.daily)return[];var d=state.weather.daily,a=[];for(var i=0;i<d.time.length;i++)a.push({date:d.time[i],rain:Number(d.precipitation_sum[i]||0),et0:Number((d.et0_fao_evapotranspiration||[])[i]||0),min:Number(d.temperature_2m_min[i]),max:Number(d.temperature_2m_max[i])});return a}'''
          new='''function weatherIsoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}\nfunction mergeWeatherData(history,forecast,source){var keys=["precipitation_sum","et0_fao_evapotranspiration","temperature_2m_min","temperature_2m_max"],byDate={};function add(src){var d=src&&src.daily;if(!d||!Array.isArray(d.time))return;d.time.forEach(function(date,i){var row=byDate[date]||{};keys.forEach(function(k){if(d[k]&&d[k][i]!=null)row[k]=d[k][i]});byDate[date]=row})}add(forecast);add(history);var dates=Object.keys(byDate).sort(),daily={time:dates};keys.forEach(function(k){daily[k]=dates.map(function(date){return byDate[date][k]!=null?byDate[date][k]:null})});var out=Object.assign({},forecast||{});out.daily=daily;out.jgwHistorySource=source||"";out.jgwWeatherVersion="2026.09.14-01";return out}\nasync function getWeather(lat,lon){var vars="precipitation_sum,et0_fao_evapotranspiration,temperature_2m_min,temperature_2m_max",now=new Date();now.setHours(12,0,0,0);var yesterday=new Date(now);yesterday.setDate(yesterday.getDate()-1);var start=new Date(yesterday);start.setDate(start.getDate()-91);var base="latitude="+encodeURIComponent(lat)+"&longitude="+encodeURIComponent(lon)+"&daily="+vars+"&timezone=Europe%2FBerlin",forecast=await requestJSON("https://api.open-meteo.com/v1/forecast?"+base+"&past_days=1&forecast_days=8",18000),history=null,source="",histBase="https://historical-forecast-api.open-meteo.com/v1/forecast?"+base+"&start_date="+weatherIsoDate(start)+"&end_date="+weatherIsoDate(yesterday);try{history=await requestJSON(histBase+"&models=icon_d2",20000);source="DWD ICON-D2 · Historischer Verlauf"}catch(e1){try{history=await requestJSON(histBase,20000);source="Open-Meteo Best Match · Historischer Verlauf"}catch(e2){history=await requestJSON("https://api.open-meteo.com/v1/forecast?"+base+"&past_days=92&forecast_days=1",20000);source="Open-Meteo Forecast-Rückblick (Fallback)"}}return mergeWeatherData(history,forecast,source)}\nfunction weatherRows(){if(!state.weather||!state.weather.daily)return[];var d=state.weather.daily,a=[],corr=state.rainCorrections||{};for(var i=0;i<d.time.length;i++){var date=d.time[i],rain=Number(d.precipitation_sum[i]||0);if(Object.prototype.hasOwnProperty.call(corr,date))rain=Number(corr[date]||0);a.push({date:date,rain:rain,et0:Number((d.et0_fao_evapotranspiration||[])[i]||0),min:Number(d.temperature_2m_min[i]),max:Number(d.temperature_2m_max[i])})}return a}'''
          if old not in s: raise SystemExit('weather functions marker not found')
          s=s.replace(old,new,1)

          old_refresh='''var w=await getWeather(wc.lat,wc.lon);state.loc=loc;state.weather=w;save();el("locationStatus").textContent="Standort geladen: "+loc.name+".";renderWeatherViews();if(state.mapReady&&!state.gardenCenter)state.map.setView([loc.lat,loc.lon],19);if(showMsg)notice("Wetterdaten aktualisiert.")'''
          new_refresh='''var w=await getWeather(wc.lat,wc.lon);state.loc=loc;state.weather=w;save();el("locationStatus").textContent="Standort geladen: "+loc.name+".";renderWeatherViews();renderYesterdayRain();if(state.mapReady&&!state.gardenCenter)state.map.setView([loc.lat,loc.lon],19);if(showMsg)notice("Wetterdaten aktualisiert.")'''
          if old_refresh not in s: raise SystemExit('refresh weather marker not found')
          s=s.replace(old_refresh,new_refresh,1)

          state_old='var state={days:30,plz:"",loc:null,gardenCenter:null,weather:null,plants:[]'
          state_new='var state={days:30,plz:"",loc:null,gardenCenter:null,weather:null,rainCorrections:{},plants:[]'
          if state_old not in s: raise SystemExit('state marker not found')
          s=s.replace(state_old,state_new,1)

          load_old='state.gardenCenter=d.gardenCenter||null;state.plants='
          load_new='state.gardenCenter=d.gardenCenter||null;state.rainCorrections=d.rainCorrections&&typeof d.rainCorrections==="object"?d.rainCorrections:{};state.plants='
          if load_old not in s: raise SystemExit('load marker not found')
          s=s.replace(load_old,load_new,1)

          apply_old='state.gardenCenter=p.gardenCenter||null;state.plants='
          apply_new='state.gardenCenter=p.gardenCenter||null;state.rainCorrections=p.rainCorrections&&typeof p.rainCorrections==="object"?p.rainCorrections:{};state.plants='
          if apply_old not in s: raise SystemExit('cloud apply marker not found')
          s=s.replace(apply_old,apply_new,1)

          payload_old='gardenCenter:state.gardenCenter||null,plants:state.plants||[]'
          payload_new='gardenCenter:state.gardenCenter||null,rainCorrections:state.rainCorrections||{},plants:state.plants||[]'
          if payload_old not in s: raise SystemExit('cloud payload marker not found')
          s=s.replace(payload_old,payload_new,1)

          save_old='gardenCenter:state.gardenCenter,plants:state.plants'
          save_new='gardenCenter:state.gardenCenter,rainCorrections:state.rainCorrections||{},plants:state.plants'
          if save_old not in s: raise SystemExit('save marker not found')
          s=s.replace(save_old,save_new,1)

          marker='function mapInteraction(enabled){'
          if marker not in s: raise SystemExit('render insert marker not found')
          helper='''function renderYesterdayRain(){document.querySelectorAll(".jgw-yesterday-rain").forEach(function(n){n.remove()});if(!state.weather)return;var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-1);var date=weatherIsoDate(d),row=weatherRows().find(function(x){return x.date===date});if(!row)return;var manual=Object.prototype.hasOwnProperty.call(state.rainCorrections||{},date),source=manual?"manuell korrigiert":((state.weather&&state.weather.jgwHistorySource)||"Open-Meteo"),html='<div><b style="color:var(--forest-dark)">💧 Regen gestern: '+row.rain.toFixed(1).replace(".",",")+' mm</b><div class="muted" style="margin-top:2px">Wetterdaten v2 · '+esc(source)+'</div></div><button class="btn ghost small jgw-rain-correct-btn" type="button">'+(manual?"Korrektur ändern":"Regen korrigieren")+'</button>';[el("view-today"),el("view-weather")].forEach(function(host){if(!host)return;var first=host.querySelector(".box"),box=document.createElement("div");box.className="box jgw-yesterday-rain";box.style.cssText="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#f3f8f0;border-color:#d8e4d4";box.innerHTML=html;if(first&&first.parentNode)first.parentNode.insertBefore(box,first.nextSibling);else host.appendChild(box);var b=box.querySelector(".jgw-rain-correct-btn");if(b)b.addEventListener("click",function(){var raw=prompt("Wie viel Regen ist gestern ungefähr gefallen?\\nZahl in mm eingeben. Leer lassen = API-Wert verwenden.",manual?String(state.rainCorrections[date]):String(Math.round(row.rain*10)/10));if(raw===null)return;raw=String(raw).trim();state.rainCorrections=state.rainCorrections||{};if(!raw)delete state.rainCorrections[date];else{var n=Number(raw.replace(",","."));if(!Number.isFinite(n)||n<0||n>300){notice("Bitte einen Regenwert zwischen 0 und 300 mm eingeben.");return}state.rainCorrections[date]=Math.round(n*10)/10}save();renderWeatherViews();renderYesterdayRain();notice("Regenwert für gestern übernommen.")})})}\n'''
          s=s.replace(marker,helper+marker,1)

          # Force a new main document version without changing the stable loader itself.
          s=s.replace('./jgw-library-nav.js?v=20260914-10','./jgw-library-nav.js?v=20260914-11',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(x for x in blocks if x.strip()),encoding='utf-8')
          assert 'jgwWeatherVersion="2026.09.14-01"' in s
          assert 'historical-forecast-api.open-meteo.com' in s
          assert 'Regen gestern:' in s
          assert 'rainCorrections' in s
          PY
          node --check /tmp/index-inline.js
      - name: Check historical weather API
        shell: bash
        run: |
          set -e
          URL='https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=48.405&longitude=9.057&start_date=2026-09-13&end_date=2026-09-13&daily=precipitation_sum,et0_fao_evapotranspiration,temperature_2m_min,temperature_2m_max&timezone=Europe%2FBerlin&models=icon_d2'
          if ! curl -fsSL --max-time 25 "$URL" -o /tmp/weather.json; then
            URL='https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=48.405&longitude=9.057&start_date=2026-09-13&end_date=2026-09-13&daily=precipitation_sum,et0_fao_evapotranspiration,temperature_2m_min,temperature_2m_max&timezone=Europe%2FBerlin'
            curl -fsSL --max-time 25 "$URL" -o /tmp/weather.json
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/weather.json'))
          assert d.get('daily',{}).get('time')
          print('WEATHER_TEST',d['daily']['time'],d['daily'].get('precipitation_sum'))
          PY
      - name: Commit weather v2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wetterhistorie und Regenkorrektur verbessern'
          git push
