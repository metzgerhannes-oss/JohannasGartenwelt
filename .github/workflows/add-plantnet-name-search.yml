name: Add PlantNet name search

"on":
  push:
    paths:
      - '.github/workflows/add-plantnet-name-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add PlantNet autocomplete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          css='\n.plant-name-field{position:relative}\n.plant-name-assist{font-size:11px;line-height:1.35;margin-top:1px}\n.plant-name-results{position:absolute;left:0;right:0;top:calc(100% - 1px);z-index:1400;background:#fffdf9;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 28px rgba(54,49,44,.16);overflow:hidden;max-height:290px;overflow-y:auto}\n.plant-name-result{width:100%;border:0;border-bottom:1px solid #f0e7dd;background:#fffdf9;padding:10px 12px;text-align:left;color:var(--txt);display:block}\n.plant-name-result:last-child{border-bottom:0}\n.plant-name-result:hover,.plant-name-result:focus{background:var(--ok);outline:none}\n.plant-name-result b{display:block;color:var(--forest-dark);font-size:13px}\n.plant-name-result small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35}\n'
          marker='/* /JGW FINAL DESIGN */'
          assert marker in s
          s=s.replace(marker,css+marker,1)
          old='<div class="field"><label for="plantName">Pflanzenname *</label><input id="plantName" required placeholder="z. B. Hortensie"></div>'
          new='<div class="field plant-name-field"><label for="plantName">Pflanzenname *</label><input id="plantName" required autocomplete="off" placeholder="z. B. Hortensie"><div class="plant-name-assist muted" id="plantNameAssist">Name eintippen – ab 3 Zeichen sucht Pl@ntNet passende Arten.</div><div class="plant-name-results hidden" id="plantNameResults" role="listbox" aria-label="Pflanzenvorschläge"></div></div>'
          assert old in s
          s=s.replace(old,new,1)
          old='el("aiResults").innerHTML="";el("aiStatus").textContent="PlantNet ist eingerichtet. Foto aufnehmen und „Mit KI erkennen“ wählen.";'
          new='el("aiResults").innerHTML="";el("aiStatus").textContent="PlantNet ist eingerichtet. Foto aufnehmen und „Mit KI erkennen“ wählen.";if(el("plantNameResults")){el("plantNameResults").innerHTML="";show("plantNameResults",false)}if(el("plantNameAssist"))el("plantNameAssist").textContent="Name eintippen – ab 3 Zeichen sucht Pl@ntNet passende Arten.";'
          assert old in s
          s=s.replace(old,new,1)
          marker='async function identifyPlant(){'
          assert marker in s
          funcs='\n'.join([
            'var plantNameSearchTimer=null,plantNameSearchSeq=0;',
            'function hidePlantNameResults(){if(el("plantNameResults")){el("plantNameResults").innerHTML="";show("plantNameResults",false)}}',
            'function plantNetSpeciesLabel(sp){var names=Array.isArray(sp.commonNames)?sp.commonNames.filter(Boolean):[],sci=sp.scientificNameWithoutAuthor||sp.scientificName||"";return{common:names[0]||sci,sci:sci,family:sp.family||""}}',
            'function applyPlantNetSpecies(sp){var x=plantNetSpeciesLabel(sp);if(!x.common&&!x.sci)return;el("plantName").value=x.common||x.sci;el("plantScientific").value=x.sci||"";var rule=applyCareRule(x.common,x.sci);if(rule){el("plantWater").value=rule.water;setCheckedMonths("fert",rule.fert);setCheckedMonths("cut",rule.cut);el("plantNameAssist").textContent="Aus Pl@ntNet übernommen · Pflegeprofil wurde vorbelegt."}else el("plantNameAssist").textContent="Aus Pl@ntNet übernommen · Pflegezeiten bei Bedarf unter Weitere Angaben ergänzen.";hidePlantNameResults()}',
            'function renderPlantNameResults(rs){var box=el("plantNameResults");if(!box)return;if(!rs.length){box.innerHTML="";show("plantNameResults",false);el("plantNameAssist").textContent="Keine passende Art in Pl@ntNet gefunden – der Name kann trotzdem frei eingetragen werden.";return}box.innerHTML=rs.map(function(sp,i){var x=plantNetSpeciesLabel(sp),detail=x.sci+(x.family?" · "+x.family:"");return \'<button class="plant-name-result" type="button" data-i="\'+i+\'" role="option"><b>\'+esc(x.common||x.sci)+\'</b><small>\'+esc(detail)+\'</small></button>\'}).join("");show("plantNameResults",true);box.querySelectorAll(".plant-name-result").forEach(function(b){b.addEventListener("click",function(){applyPlantNetSpecies(rs[Number(b.dataset.i)])})})}',
            'async function searchPlantNetSpecies(query){var q=String(query||"").trim(),assist=el("plantNameAssist"),key=(state.settings.plantnetKey||"").trim();if(q.length<3){hidePlantNameResults();if(assist)assist.textContent="Name eintippen – ab 3 Zeichen sucht Pl@ntNet passende Arten.";return}if(!key){hidePlantNameResults();if(assist)assist.textContent="Namensvorschläge sind verfügbar, sobald Pl@ntNet in den Einstellungen eingerichtet ist.";return}var seq=++plantNameSearchSeq;if(assist)assist.textContent="Pl@ntNet wird durchsucht …";try{var url="https://my-api.plantnet.org/v2/species?lang=de&page=1&pageSize=8&prefix="+encodeURIComponent(q)+"&api-key="+encodeURIComponent(key),res=await fetch(url);if(!res.ok)throw new Error("HTTP "+res.status);var data=await res.json();if(seq!==plantNameSearchSeq)return;var rs=Array.isArray(data)?data:(Array.isArray(data.results)?data.results:[]);renderPlantNameResults(rs.slice(0,8));if(rs.length&&assist)assist.textContent="Vorschlag antippen oder den Namen frei weiterschreiben."}catch(e){if(seq!==plantNameSearchSeq)return;hidePlantNameResults();if(assist)assist.textContent=e.message.indexOf("403")>=0?"Pl@ntNet blockiert die Namenssuche. Bitte API-Key/CORS-Freigabe prüfen.":"Pl@ntNet-Suche gerade nicht erreichbar – der Name kann trotzdem frei eingetragen werden."}}'
          ])+'\n'
          s=s.replace(marker,funcs+marker,1)
          marker='el("newPlantBtn").addEventListener("click",function(){openPlantEditor(null)});'
          assert marker in s
          events='el("plantName").addEventListener("input",function(){clearTimeout(plantNameSearchTimer);var q=this.value;plantNameSearchTimer=setTimeout(function(){searchPlantNetSpecies(q)},350)});\nel("plantName").addEventListener("focus",function(){if(this.value.trim().length>=3)searchPlantNetSpecies(this.value)});\nel("plantName").addEventListener("keydown",function(e){if(e.key==="Escape")hidePlantNameResults()});\ndocument.addEventListener("click",function(e){var f=e.target.closest&&e.target.closest(".plant-name-field");if(!f)hidePlantNameResults()});\n'
          s=s.replace(marker,marker+'\n'+events,1)
          old='el("plantName").value=common;el("plantScientific").value=sci;var rule=applyCareRule(common,sci);'
          new='el("plantName").value=common;el("plantScientific").value=sci;hidePlantNameResults();if(el("plantNameAssist"))el("plantNameAssist").textContent="Aus der Fotoerkennung übernommen.";var rule=applyCareRule(common,sci);'
          assert old in s
          s=s.replace(old,new,1)
          assert s!=original
          assert 'id="plantNameResults"' in s
          assert 'function searchPlantNetSpecies' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          assert s.count('id="plantNameResults"')==1
          assert 'function searchPlantNetSpecies' in s
          assert 'pageSize=8' in s
          assert 'autocomplete="off"' in s
          PY
          node --check /tmp/index.js
          git diff --check
      - name: Commit PlantNet name search
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add PlantNet name suggestions"
          git push origin main
