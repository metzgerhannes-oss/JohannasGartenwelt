name: Activate card shell v3
on:
  push:
    paths:
      - '.github/workflows/activate-card-shell-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bump main loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r'jgw-library-nav\.js\?v=[^"\']+', 'jgw-library-nav.js?v=20260914-15', s, count=1)
          if n != 1:
              raise SystemExit('loader reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check jgw-library-nav.js
          node --check jgw-ux-shell.js
          node --check jgw-ui-cleanup-20260914.js
          grep -q 'jgw-library-nav.js?v=20260914-15' index.html
          grep -q 'jgw-ux-shell.js","20260914-3' jgw-library-nav.js
          grep -q 'jgw-ui-cleanup-20260914.js","20260914-3' jgw-library-nav.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Karten-Shell v3 aktivieren'
          git push
