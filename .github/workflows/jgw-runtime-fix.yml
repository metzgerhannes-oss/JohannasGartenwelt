name: One-time runtime integration fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jgw-runtime-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime bridge and cache busting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          bridge_marker = 'window.JGWCore={getState:function(){return state}'
          init_marker = 'renderAll();syncBootstrap();setTimeout(backfillPlantReferencePhotos,1400);if(state.plz)refreshWeather(false);'
          bridge = '''window.JGWCore={getState:function(){return state},switchView:switchView,setNatureTab:setNatureTab,renderPlants:renderPlants,renderNatureTabs:renderNatureTabs,renderHabitats:renderHabitats,renderAnimals:renderAnimals,renderCalendar:renderCalendar,openPlantDetail:openPlantDetail,openAnimalDetail:openAnimalDetail};\nwindow.switchView=switchView;window.setNatureTab=setNatureTab;window.renderPlants=renderPlants;window.renderNatureTabs=renderNatureTabs;window.renderHabitats=renderHabitats;window.renderAnimals=renderAnimals;window.openPlantDetail=openPlantDetail;window.openAnimalDetail=openAnimalDetail;window.state=state;\n'''
          if bridge_marker not in s:
              if init_marker not in s:
                  raise SystemExit('Core init marker not found')
              s = s.replace(init_marker, bridge + init_marker, 1)

          import re
          s, n = re.subn(r'<script src="\./jgw-library-nav\.js(?:\?v=[^"]*)?"></script>', '<script src="./jgw-library-nav.js?v=20260912-runtime2"></script>', s, count=1)
          if n != 1:
              raise SystemExit('Library script tag not found')
          index.write_text(s, encoding='utf-8')

          nav = Path('jgw-library-nav.js')
          j = nav.read_text(encoding='utf-8')
          old = '  function openLegacy(view){if(legacy[view])legacy[view].click();else activateCustom(view)}'
          new = '  function openLegacy(view){if(window.JGWCore&&typeof window.JGWCore.switchView==="function")window.JGWCore.switchView(view);else if(typeof window.switchView==="function")window.switchView(view);else if(legacy[view])legacy[view].click();else activateCustom(view)}'
          if old in j:
              j = j.replace(old, new, 1)
          elif new not in j:
              raise SystemExit('openLegacy marker not found')

          old2 = '    if(typeof window.setNatureTab==="function"){\n      window.setNatureTab(kind);'
          new2 = '    if(window.JGWCore&&typeof window.JGWCore.setNatureTab==="function"){\n      window.JGWCore.setNatureTab(kind);\n    }else if(typeof window.setNatureTab==="function"){\n      window.setNatureTab(kind);'
          if old2 in j:
              j = j.replace(old2, new2, 1)
          elif new2 not in j:
              raise SystemExit('setNatureTab bridge marker not found')

          nav.write_text(j, encoding='utf-8')
          PY

          node --check jgw-library-nav.js
          grep -q 'window.JGWCore={getState:function(){return state}' index.html
          grep -q 'jgw-library-nav.js?v=20260912-runtime2' index.html

      - name: Runtime interaction test
        shell: bash
        run: |
          mkdir -p /tmp/jgw-test
          cd /tmp/jgw-test
          npm init -y >/dev/null 2>&1
          npm install jsdom@24.1.3 --silent
          cat > test.mjs <<'JS'
          import fs from 'fs';
          import {JSDOM, VirtualConsole} from 'jsdom';

          let html=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/index.html','utf8');
          const nav=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/jgw-library-nav.js','utf8');
          html=html.replace(/<script[^>]+src="https:\/\/[^\"]+"[^>]*><\/script>/g,'');
          html=html.replace(/<script src="\.\/jgw-library-nav\.js[^\"]*"><\/script>/, '<script>'+nav.replace(/<\/script>/gi,'<\\/script>')+'</script>');

          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push(String(e.message||e)));
          vc.on('error',e=>errors.push(String(e)));

          const dom=new JSDOM(html,{
            runScripts:'dangerously',
            url:'https://example.test/',
            pretendToBeVisual:true,
            virtualConsole:vc,
            beforeParse(w){
              w.matchMedia=()=>({matches:false,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){}});
              w.requestAnimationFrame=(cb)=>setTimeout(()=>cb(Date.now()),0);
              w.cancelAnimationFrame=(id)=>clearTimeout(id);
              w.scrollTo=()=>{};
              w.HTMLElement.prototype.scrollIntoView=function(){};
              w.confirm=()=>true;
              w.fetch=async()=>({ok:false,status:503,json:async()=>({results:[]}),text:async()=>''});
              w.ResizeObserver=class{observe(){} unobserve(){} disconnect(){}};
              w.IntersectionObserver=class{observe(){} unobserve(){} disconnect(){}};
              w.localStorage.setItem('giess_check_garten_v3',JSON.stringify({
                plants:[{id:'p1',name:'Lavendel',scientific:'Lavandula angustifolia',quantity:2,area:'Beet',careMeta:{}}],
                habitats:[{id:'h1',type:'deadwood',status:'present',area:'Ecke'}],
                animals:[{id:'a1',name:'Igel',scientific:'Erinaceus europaeus',group:'mammal',date:'2026-09-12'}],
                areas:[],zones:[],ecology:{},settings:{natureTab:'plants'},days:30
              }));
            }
          });
          const w=dom.window;
          await new Promise(r=>setTimeout(r,180));
          const d=w.document;
          function assert(cond,msg){if(!cond)throw new Error(msg)}
          assert(w.JGWCore && typeof w.JGWCore.getState==='function','Core bridge fehlt');
          assert(w.JGWCore.getState().plants.length===1,'Eigene Pflanzen nicht erreichbar');
          const visibleTabs=[...d.querySelectorAll('.tabs > .tab')];
          assert(visibleTabs.length===5,'Hauptnavigation hat nicht 5 Einträge');

          const lib=visibleTabs.find(x=>x.dataset.view==='library');
          assert(lib,'Bibliothek-Navigation fehlt');
          lib.click();
          await new Promise(r=>setTimeout(r,50));
          assert(d.getElementById('view-library')?.classList.contains('active'),'Bibliothek öffnet nicht');
          assert(d.querySelectorAll('#jgwLibraryGrid .jgw-own-plant').length===1,'Eigene Pflanzen erscheinen nicht in Bibliothek');

          d.getElementById('jgwLibraryAnimals').click();
          await new Promise(r=>setTimeout(r,30));
          assert(d.querySelectorAll('#jgwLibraryGrid .jgw-own-animal').length===1,'Eigene Tiere erscheinen nicht in Bibliothek');

          d.getElementById('jgwLibraryScope').click();
          await new Promise(r=>setTimeout(r,30));
          assert(d.getElementById('jgwLibraryScope').getAttribute('aria-checked')==='false','Mein-Garten-Schalter reagiert nicht');
          assert(d.querySelectorAll('#jgwLibraryGrid .jgw-library-card').length>0,'Stöbermodus zeigt keine Startauswahl');

          const garden=visibleTabs.find(x=>x.dataset.view==='plants');
          garden.click();
          await new Promise(r=>setTimeout(r,30));
          const habitatBtn=d.querySelector('.nature-tab[data-nature="habitats"]');
          assert(habitatBtn,'Lebensräume-Schalter fehlt');
          habitatBtn.click();
          await new Promise(r=>setTimeout(r,30));
          assert(!d.getElementById('natureHabitatsPane').classList.contains('hidden'),'Lebensräume-Schalter öffnet Inhalt nicht');
          assert(habitatBtn.classList.contains('active'),'Lebensräume-Schalter wird nicht aktiv');

          if(errors.length) console.log('Nicht-blockierende jsdom Meldungen:',errors.slice(0,5));
          console.log('JGW runtime interaction test: PASS');
          dom.window.close();
          JS
          node test.mjs

      - name: Commit tested fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/jgw-runtime-fix.yml
          git add index.html jgw-library-nav.js
          git commit -m 'Fix library runtime bridge and garden navigation'
          git push
