name: Install Garten-Tipps

on:
  push:
    paths:
      - '.github/workflows/install-garten-tipps.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garten-Tipps in index.html einbinden
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./garten-tipps.js"></script>'
          if tag not in text:
              marker = '</body>'
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit('Kein </body> in index.html gefunden')
              text = text[:pos] + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')
          PY
      - name: Änderung committen
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Garten-Tipps bereits eingebunden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Garten-Tipps in App einbinden"
          git push
