name: Activate gallery fix
on:
  push:
    paths:
      - '.github/workflows/activate-gallery-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2,n=re.subn(r'jgw-library-nav\.js\?v=[^"\']+', 'jgw-library-nav.js?v=20260914-14', s, count=1)
          if n != 1:
              raise SystemExit('loader reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Verify JavaScript
        shell: bash
        run: |
          node --check jgw-library-nav.js
          node --check jgw-ui-cleanup-20260914.js
          grep -q 'jgw-library-nav.js?v=20260914-14' index.html
          grep -q '#plantList .collection-card' jgw-ui-cleanup-20260914.js
      - name: Commit activation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Galerie-Fix aktivieren'
          git push
