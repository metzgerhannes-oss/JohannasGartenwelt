name: One-time library navigation upgrade

on:
  push:
    paths:
      - '.github/workflows/jgw-library-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install separate library navigation
        shell: bash
        run: |
          cat > jgw-library-nav.js <<'JGWJS'
          (function(){
            "use strict";
            if(window.__jgwLibraryNavInstalled)return;
            window.__jgwLibraryNavInstalled=true;

            function el(id){return document.getElementById(id)}
            function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
            function q(sel,root){return(root||document).querySelector(sel)}
            function qa(sel,root){return Array.from((root||document).querySelectorAll(sel))}

            var css=document.createElement("style");
            css.textContent=`
              /* JGW SEPARATE LIBRARY NAVIGATION */
              #legacyNavBridge{display:none!important}
              .jgw-add-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:14px}
              .jgw-add-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fffdf9,#faf5ed);padding:18px;text-align:left;color:var(--forest-dark);min-height:150px;box-shadow:0 6px 16px rgba(80,100,72,.07);display:flex;flex-direction:column;justify-content:space-between;gap:14px}
              .jgw-add-card:hover,.jgw-library-card:hover{transform:translateY(-2px)}
              .jgw-add-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#eef5e8;border:1px solid #dce7d5;font-size:26px}
              .jgw-add-card b{display:block;font:700 20px Georgia,"Times New Roman",serif;margin-top:8px}
              .jgw-add-card small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:5px}
              .jgw-library-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
              .jgw-library-switch{display:inline-flex;padding:4px;border:1px solid #dfd4c7;border-radius:999px;background:#f2ebe3;gap:3px}
              .jgw-library-switch button{min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;padding:8px 14px}
              .jgw-library-switch button.active{background:#fffdf9;color:var(--forest-dark);box-shadow:0 2px 8px rgba(54,49,44,.08)}
              .jgw-library-search-wrap{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
              .jgw-library-search{width:100%;min-height:46px;border:1px solid #ddcfc0;border-radius:14px;padding:10px 13px;background:#fffdf9;color:var(--txt)}
              .jgw-library-note{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.45}
              .jgw-library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
              .jgw-library-card{padding:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fffdf9;text-align:left;color:inherit;box-shadow:0 7px 18px rgba(80,100,72,.08);transition:transform .16s ease,box-shadow .16s ease;min-width:0}
              .jgw-library-photo{aspect-ratio:4/3;background:linear-gradient(145deg,#edf4e8,#f8ecee);display:grid;place-items:center;font-size:48px;overflow:hidden;position:relative}
              .jgw-library-photo img{width:100%;height:100%;object-fit:cover;display:block}
              .jgw-library-photo .jgw-source{position:absolute;right:8px;bottom:8px;background:rgba(40,54,38,.76);color:white;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800;backdrop-filter:blur(6px)}
              .jgw-library-body{padding:12px 13px 14px}.jgw-library-name{font:700 18px/1.15 Georgia,"Times New Roman",serif;color:var(--forest-dark)}
              .jgw-library-latin{font-size:11px;color:var(--muted);font-style:italic;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              .jgw-library-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.jgw-library-chip{font-size:10px;font-weight:800;padding:5px 7px;border-radius:999px;background:#eef5e8;border:1px solid #d7e4d0;color:#52664d}
              .jgw-library-empty{grid-column:1/-1;text-align:center;padding:30px 18px;color:var(--muted);border:1px dashed #dfd2c5;border-radius:18px;background:rgba(255,253,249,.7)}
              .jgw-library-loading{grid-column:1/-1;text-align:center;padding:22px;color:var(--muted)}
              .jgw-library-detail-source{font-size:10px;color:var(--muted);line-height:1.4;margin-top:7px}
              .jgw-more-today{order:-1}
              @media(max-width:700px){
                .tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important}
                .tabs .tab{font-size:9.8px}
                .jgw-add-grid{grid-template-columns:1fr}.jgw-add-card{min-height:112px;display:grid;grid-template-columns:auto 1fr;align-items:center;justify-content:initial}.jgw-add-card>span:last-child{min-width:0}
                .jgw-library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.jgw-library-name{font-size:16px}.jgw-library-body{padding:10px}.jgw-library-switch{width:100%;display:grid;grid-template-columns:1fr 1fr}.jgw-library-switch button{width:100%}.jgw-library-search-wrap{grid-template-columns:1fr}.jgw-library-search-wrap .btn{width:100%}
              }
              @media(max-width:370px){.tabs .tab{font-size:8.6px}.tabs .navicon{font-size:16px}.jgw-library-grid{grid-template-columns:1fr}}
              /* /JGW SEPARATE LIBRARY NAVIGATION */
            `;
            document.head.appendChild(css);

            var tabs=q(".tabs");
            if(!tabs)return;
            var legacyButtons=qa(":scope > .tab",tabs);
            var legacy={};
            legacyButtons.forEach(function(b){legacy[b.dataset.view]=b});
            var bridge=document.createElement("div");bridge.id="legacyNavBridge";bridge.hidden=true;
            legacyButtons.forEach(function(b){bridge.appendChild(b)});
            document.body.appendChild(bridge);

            function iconSvg(name){
              var icons={
                garden:'<svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 19v-5c0-3 2-5 5-5s5 2 5 5v5"/><path d="M12 9V4"/><path d="M12 7c-3 0-4.8-1.7-4.8-4.2C10.2 2.8 12 4.5 12 7Z"/><path d="M12 7c3 0 4.8-1.7 4.8-4.2C13.8 2.8 12 4.5 12 7Z"/></svg>',
                add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>',
                library:'<svg viewBox="0 0 24 24"><path d="M5 5.5c2.8-.7 5.2-.2 7 1.4v12c-1.8-1.6-4.2-2.1-7-1.4z"/><path d="M19 5.5c-2.8-.7-5.2-.2-7 1.4v12c1.8-1.6 4.2-2.1 7-1.4z"/></svg>',
                tasks:'<svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="m8.5 9 1.5 1.5 3-3M8.5 14l1.5 1.5 3-3"/></svg>',
                more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'
              };return icons[name]||"";
            }
            function navButton(view,label,icon){var b=document.createElement("button");b.className="tab";b.dataset.view=view;b.type="button";b.innerHTML='<span class="navicon" aria-hidden="true">'+iconSvg(icon)+'</span><span>'+label+'</span>';return b}
            var main={
              plants:navButton("plants","Mein Garten","garden"),
              add:navButton("add","Hinzufügen","add"),
              library:navButton("library","Bibliothek","library"),
              calendar:navButton("calendar","Aufgaben","tasks"),
              more:navButton("more","Mehr","more")
            };
            Object.keys(main).forEach(function(k){tabs.appendChild(main[k])});

            function activateCustom(view){
              qa(".view").forEach(function(v){v.classList.toggle("active",v.id==="view-"+view)});
              qa(".tab").forEach(function(b){b.classList.toggle("active",b.dataset.view===view)});
              window.scrollTo({top:0,behavior:"smooth"});
            }
            function openLegacy(view){if(legacy[view])legacy[view].click();else activateCustom(view)}

            main.plants.addEventListener("click",function(){openLegacy("plants")});
            main.calendar.addEventListener("click",function(){openLegacy("calendar")});
            main.more.addEventListener("click",function(){openLegacy("more")});
            main.add.addEventListener("click",function(){activateCustom("add")});
            main.library.addEventListener("click",function(){activateCustom("library");renderLibrary()});

            var plantsView=el("view-plants");
            if(plantsView){
              var head=plantsView.querySelector(".nature-head h2");if(head)head.textContent="Mein Garten";
              var sub=plantsView.querySelector(".nature-head .muted");if(sub)sub.textContent="Alles, was in deinem Garten tatsächlich vorhanden ist – Pflanzen, Lebensräume und Beobachtungen.";
              var nTabs=el("natureTabs");if(nTabs)nTabs.setAttribute("aria-label","Mein Garten");
              var animalTab=q('.nature-tab[data-nature="animals"]');if(animalTab)animalTab.innerHTML='🦋 Beobachtungen <span class="nature-count" id="natureAnimalCount">0</span>';
              var plantPaneTitle=q("#naturePlantsPane h2");if(plantPaneTitle)plantPaneTitle.textContent="Meine Pflanzen";
            }

            var addView=document.createElement("section");addView.className="view";addView.id="view-add";
            addView.innerHTML=`
              <div class="box">
                <div class="topline"><div><h2>Hinzufügen</h2><div class="muted">Was möchtest du neu in deinem Garten erfassen?</div></div></div>
                <div class="jgw-add-grid">
                  <button class="jgw-add-card" id="jgwAddPlant" type="button"><span><span class="jgw-add-icon">🌿</span></span><span><b>Pflanze</b><small>Neue Pflanze anlegen, fotografieren oder automatisch erkennen lassen.</small></span></button>
                  <button class="jgw-add-card" id="jgwAddHabitat" type="button"><span><span class="jgw-add-icon">🪵</span></span><span><b>Lebensraum</b><small>Wasserstelle, Totholz, wilde Ecke und weitere Strukturen dokumentieren.</small></span></button>
                  <button class="jgw-add-card" id="jgwAddAnimal" type="button"><span><span class="jgw-add-icon">🦋</span></span><span><b>Tierbeobachtung</b><small>Ein Tier festhalten, das du in deinem Garten gesehen hast.</small></span></button>
                </div>
              </div>`;
            var calendarView=el("view-calendar");(calendarView&&calendarView.parentNode?calendarView.parentNode:q("#app")).insertBefore(addView,calendarView||null);

            function goPersonal(kind){
              openLegacy("plants");
              setTimeout(function(){
                var tab=q('.nature-tab[data-nature="'+kind+'"]');if(tab)tab.click();
                if(kind==="plants"&&el("newPlantBtn"))el("newPlantBtn").click();
                if(kind==="habitats"&&el("newHabitatBtn"))el("newHabitatBtn").click();
                if(kind==="animals"&&el("newAnimalBtn"))el("newAnimalBtn").click();
              },20);
            }
            el("jgwAddPlant").addEventListener("click",function(){goPersonal("plants")});
            el("jgwAddHabitat").addEventListener("click",function(){goPersonal("habitats")});
            el("jgwAddAnimal").addEventListener("click",function(){goPersonal("animals")});

            var libraryView=document.createElement("section");libraryView.className="view";libraryView.id="view-library";
            libraryView.innerHTML=`
              <div class="box">
                <div class="jgw-library-head">
                  <div><h2>Bibliothek</h2><div class="muted">In Ruhe anschauen, stöbern und Neues entdecken. Die Bibliothek verändert deinen Gartenbestand nicht.</div></div>
                  <div class="jgw-library-switch" role="tablist" aria-label="Bibliothek auswählen">
                    <button class="active" id="jgwLibraryPlants" type="button" role="tab" aria-selected="true">🌿 Pflanzen</button>
                    <button id="jgwLibraryAnimals" type="button" role="tab" aria-selected="false">🦋 Tiere</button>
                  </div>
                </div>
                <div class="jgw-library-search-wrap"><input class="jgw-library-search" id="jgwLibrarySearch" type="search" autocomplete="off" placeholder="Pflanze suchen …"><button class="btn secondary" id="jgwLibraryClear" type="button">Entdecken</button></div>
                <div class="jgw-library-note" id="jgwLibraryHint">Beliebte Pflanzen zum Durchstöbern. Ab drei Buchstaben kannst du nach weiteren Pflanzen suchen.</div>
              </div>
              <div class="jgw-library-grid" id="jgwLibraryGrid"></div>`;
            var moreView=el("view-more");(moreView&&moreView.parentNode?moreView.parentNode:q("#app")).insertBefore(libraryView,moreView||null);

            var plantSeeds=[
              {name:"Lavendel",scientific:"Lavandula angustifolia",kind:"Staude",icon:"🌿"},
              {name:"Schafgarbe",scientific:"Achillea millefolium",kind:"Wildstaude",icon:"🌼"},
              {name:"Wiesensalbei",scientific:"Salvia pratensis",kind:"Wildstaude",icon:"🌸"},
              {name:"Fetthenne",scientific:"Hylotelephium telephium",kind:"Staude",icon:"🌸"},
              {name:"Efeu",scientific:"Hedera helix",kind:"Kletterpflanze",icon:"🌿"},
              {name:"Apfel",scientific:"Malus domestica",kind:"Obstgehölz",icon:"🍎"},
              {name:"Hundsrose",scientific:"Rosa canina",kind:"Gehölz",icon:"🌹"},
              {name:"Wilder Dost",scientific:"Origanum vulgare",kind:"Wildstaude",icon:"🌿"},
              {name:"Schneeglöckchen",scientific:"Galanthus nivalis",kind:"Frühblüher",icon:"🌱"}
            ];
            var animalSeeds=[
              {name:"Tagpfauenauge",scientific:"Aglais io",kind:"butterfly",icon:"🦋"},
              {name:"Zitronenfalter",scientific:"Gonepteryx rhamni",kind:"butterfly",icon:"🦋"},
              {name:"Ackerhummel",scientific:"Bombus pascuorum",kind:"bee",icon:"🐝"},
              {name:"Gehörnte Mauerbiene",scientific:"Osmia cornuta",kind:"bee",icon:"🐝"},
              {name:"Siebenpunkt-Marienkäfer",scientific:"Coccinella septempunctata",kind:"beetle",icon:"🐞"},
              {name:"Igel",scientific:"Erinaceus europaeus",kind:"mammal",icon:"🦔"},
              {name:"Amsel",scientific:"Turdus merula",kind:"bird",icon:"🐦"},
              {name:"Grasfrosch",scientific:"Rana temporaria",kind:"amphibian",icon:"🐸"},
              {name:"Gartenkreuzspinne",scientific:"Araneus diadematus",kind:"spider",icon:"🕷️"}
            ];
            var libraryKind="plants",libraryTimer=null,librarySeq=0,seedCache={plants:null,animals:null};

            function animalGroupIcon(v){return{insect:"🐞",butterfly:"🦋",bee:"🐝",beetle:"🐞",spider:"🕷️",bird:"🐦",mammal:"🦔",amphibian:"🐸",reptile:"🦎",mollusc:"🐌",other:"🐾"}[v]||"🐾"}
            function animalGroupLabel(v){return{insect:"Insekt",butterfly:"Schmetterling / Nachtfalter",bee:"Biene / Hummel / Wespe",beetle:"Käfer",spider:"Spinne",bird:"Vogel",mammal:"Säugetier",amphibian:"Amphibie",reptile:"Reptil",mollusc:"Schnecke / Weichtier",other:"Tier"}[v]||"Tier"}
            function inatGroup(t){var n=String(t&&t.iconic_taxon_name||"").toLowerCase(),ids=t&&t.ancestor_ids||[];if(ids.includes(47157))return"butterfly";if(ids.includes(47208))return"beetle";if(ids.includes(47201))return"bee";if(n==="arachnida")return"spider";if(n==="aves")return"bird";if(n==="mammalia")return"mammal";if(n==="amphibia")return"amphibian";if(n==="reptilia")return"reptile";if(n==="mollusca")return"mollusc";if(n==="insecta")return"insect";return"other"}
            function fromTaxon(t,kind){var ph=t&&t.default_photo||{},isPlant=kind==="plants",group=isPlant?"Pflanze":inatGroup(t);return{taxonId:t&&t.id||"",name:t&&t.preferred_common_name||t&&t.matched_term||t&&t.name||"Unbekannt",scientific:t&&t.name||"",kind:group,icon:isPlant?"🌿":animalGroupIcon(group),photo:ph.medium_url||ph.large_url||ph.square_url||"",attribution:ph.attribution||"",rank:t&&t.rank||""}}
            function renderCards(items){
              var grid=el("jgwLibraryGrid");if(!grid)return;
              if(!items||!items.length){grid.innerHTML='<div class="jgw-library-empty">Keine passenden Einträge gefunden. Versuche einen anderen Namen.</div>';return}
              grid.innerHTML=items.map(function(x,i){var group=libraryKind==="plants"?(x.kind||"Pflanze"):animalGroupLabel(x.kind);return '<button class="jgw-library-card" type="button" data-i="'+i+'"><div class="jgw-library-photo">'+(x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'">':'<span>'+esc(x.icon||"🌿")+'</span>')+(x.photo?'<span class="jgw-source">iNaturalist</span>':'')+'</div><div class="jgw-library-body"><div class="jgw-library-name">'+esc(x.name)+'</div><div class="jgw-library-latin">'+esc(x.scientific||"")+'</div><div class="jgw-library-meta"><span class="jgw-library-chip">'+esc(group)+'</span></div></div></button>'}).join("");
              qa(".jgw-library-card",grid).forEach(function(b){b.addEventListener("click",function(){openLibraryDetail(items[Number(b.dataset.i)])})});
            }
            async function hydrateSeeds(kind){
              if(seedCache[kind]){renderCards(seedCache[kind]);return}
              var base=(kind==="plants"?plantSeeds:animalSeeds).map(function(x){return Object.assign({},x)});renderCards(base);
              var enriched=await Promise.all(base.map(async function(x){try{var u="https://api.inaturalist.org/v1/taxa/autocomplete?q="+encodeURIComponent(x.scientific)+"&locale=de&per_page=4"+(kind==="plants"?"&taxon_id=47126":""),r=await fetch(u,{headers:{Accept:"application/json"}});if(!r.ok)return x;var d=await r.json(),a=d.results||[],t=a.find(function(v){return String(v.name||"").toLowerCase()===x.scientific.toLowerCase()})||a[0];if(!t)return x;var y=fromTaxon(t,kind);if(!y.name||y.name===y.scientific)y.name=x.name;if(kind==="animals"&&y.kind==="other")y.kind=x.kind;return Object.assign({},x,y)}catch(e){return x}}));
              seedCache[kind]=enriched;if(!el("jgwLibrarySearch").value.trim()&&libraryKind===kind)renderCards(enriched);
            }
            async function searchLibrary(term){
              term=String(term||"").trim();var seq=++librarySeq;
              if(term.length<3){hydrateSeeds(libraryKind);return}
              el("jgwLibraryGrid").innerHTML='<div class="jgw-library-loading">Bibliothek wird durchsucht …</div>';
              try{var url="https://api.inaturalist.org/v1/taxa/autocomplete?q="+encodeURIComponent(term)+"&locale=de&per_page=18"+(libraryKind==="plants"?"&taxon_id=47126":"&taxon_id=1"),res=await fetch(url,{headers:{Accept:"application/json"}});if(!res.ok)throw new Error("HTTP "+res.status);var d=await res.json();if(seq!==librarySeq)return;var rs=(d.results||[]);if(libraryKind==="animals")rs=rs.filter(function(t){return String(t.iconic_taxon_name||"").toLowerCase()!=="plantae"});renderCards(rs.slice(0,15).map(function(t){return fromTaxon(t,libraryKind)}))}catch(e){if(seq!==librarySeq)return;el("jgwLibraryGrid").innerHTML='<div class="jgw-library-empty">Die Online-Bibliothek ist gerade nicht erreichbar. Die Entdecken-Auswahl bleibt weiterhin verfügbar.</div>'}
            }
            function renderLibrary(){
              var plant=libraryKind==="plants";el("jgwLibraryPlants").classList.toggle("active",plant);el("jgwLibraryAnimals").classList.toggle("active",!plant);el("jgwLibraryPlants").setAttribute("aria-selected",String(plant));el("jgwLibraryAnimals").setAttribute("aria-selected",String(!plant));el("jgwLibrarySearch").placeholder=plant?"Pflanze suchen …":"Tier suchen …";el("jgwLibraryHint").textContent=plant?"Pflanzen zum Durchstöbern. Ab drei Buchstaben kannst du nach weiteren Arten suchen.":"Tiere zum Durchstöbern. Ab drei Buchstaben kannst du nach weiteren Arten suchen.";var term=el("jgwLibrarySearch").value.trim();if(term.length>=3)searchLibrary(term);else hydrateSeeds(libraryKind)
            }
            el("jgwLibraryPlants").addEventListener("click",function(){libraryKind="plants";el("jgwLibrarySearch").value="";renderLibrary()});
            el("jgwLibraryAnimals").addEventListener("click",function(){libraryKind="animals";el("jgwLibrarySearch").value="";renderLibrary()});
            el("jgwLibrarySearch").addEventListener("input",function(){clearTimeout(libraryTimer);var v=this.value;libraryTimer=setTimeout(function(){searchLibrary(v)},350)});
            el("jgwLibraryClear").addEventListener("click",function(){el("jgwLibrarySearch").value="";renderLibrary()});

            function openLibraryDetail(item){
              var overlay=el("plantDetailOverlay"),content=el("plantDetailContent"),heading=el("plantDetailHeading");if(!overlay||!content)return;
              var plant=libraryKind==="plants",group=plant?(item.kind||"Pflanze"):animalGroupLabel(item.kind),hero=item.photo?'<img src="'+esc(item.photo)+'" alt="'+esc(item.name)+'">':esc(item.icon||(plant?"🌿":"🐾"));
              heading.textContent=item.name;
              content.innerHTML='<div class="detail-hero">'+hero+'</div><div class="detail-title"><div><h3>'+esc(item.name)+'</h3><div class="latin">'+esc(item.scientific||"")+'</div></div></div><div class="detail-section"><h4>'+esc(group)+'</h4><div class="muted">'+(plant?'Diese Art kannst du aus der Bibliothek direkt als Pflanze in deinen Garten übernehmen.':'Wenn du dieses Tier in deinem Garten beobachtet hast, kannst du daraus direkt eine Beobachtung anlegen.')+'</div>'+(item.attribution?'<div class="jgw-library-detail-source">Referenzbild aus iNaturalist · '+esc(item.attribution)+'</div>':'')+'</div><div class="actions" style="margin-top:14px"><button class="btn" id="jgwLibraryTake" type="button">'+(plant?'In meinen Garten übernehmen':'Als Beobachtung erfassen')+'</button></div>';
              overlay.classList.remove("hidden");overlay.setAttribute("aria-hidden","false");document.body.classList.add("settings-open");
              el("jgwLibraryTake").addEventListener("click",function(){if(el("plantDetailClose"))el("plantDetailClose").click();if(plant)addPlantFromLibrary(item);else addAnimalFromLibrary(item)});
            }
            function addPlantFromLibrary(item){
              openLegacy("plants");setTimeout(function(){var tab=q('.nature-tab[data-nature="plants"]');if(tab)tab.click();if(el("newPlantBtn"))el("newPlantBtn").click();setTimeout(function(){if(el("plantName")){el("plantName").value=item.name||"";el("plantName").dispatchEvent(new Event("input",{bubbles:true}))}if(el("plantScientific")){el("plantScientific").value=item.scientific||"";el("plantScientific").dispatchEvent(new Event("input",{bubbles:true}))}},30)},20)
            }
            function addAnimalFromLibrary(item){
