name: PlantNet identification fix

on:
  push:
    paths:
      - '.github/workflows/plantnet-identification-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve PlantNet photo identification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path=Path('index.html')
          s=path.read_text(encoding='utf-8')
          start=s.find('async function identifyPlant(){')
          end=s.find('\nfunction finishNaturePlacement',start)
          if start < 0 or end < 0:
              raise SystemExit('identifyPlant markers not found')
          payload=''
          new_function=base64.b64decode(payload).decode('utf-8')
          path.write_text(s[:start]+new_function+s[end:],encoding='utf-8')
          print('PlantNet identification patched')
          PY

      - name: Static syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'no-reject=true' in s
          assert 'Pl@ntNet war beim ersten Versuch nicht sicher' in s
          assert 'Bei einer lokal geöffneten Datei kann zusätzlich eine CORS-Freigabe' not in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index.js').write_text('\n'.join(b for b in blocks if b.strip()),encoding='utf-8')
          print('PlantNet patch audit OK')
          PY
          node --check /tmp/index.js
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/plantnet-identification-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve PlantNet photo identification"
          git push origin main
